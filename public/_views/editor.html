<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingBuilder - Pro Editor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script>
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-component-countdown@1.0.1"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; }
        [x-cloak] { display: none !important; }
        
        /* FIX CANVAS OVERLAP & PADDING - INI YANG ANDA MINTA */
        .gjs-cv-canvas { 
            width: calc(100% - 320px) !important; 
            height: calc(100% - 60px) !important; /* Kurangi tinggi header */
            top: 60px !important; /* Turunkan canvas 60px dari atas */
            left: 0 !important;
            background-color: #f1f5f9; 
        }

        /* UI Overrides */
        .gjs-pn-top-panel, .gjs-pn-views-container, .gjs-pn-views { display: none !important; }
        .gjs-selected { outline: 2px solid #2563eb !important; outline-offset: -2px; }
        
        /* Panel Sidebar */
        .sidebar-desktop {
            position: fixed;
            top: 56px; right: 0; bottom: 0; width: 320px;
            background: white; border-left: 1px solid #e2e8f0;
            display: flex; flex-direction: column; z-index: 100;
            box-shadow: -4px 0 15px rgba(0,0,0,0.02);
        }
        
        .input-std { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; }
    </style>
</head>

<body x-data="editorApp()">

    <header class="h-14 bg-white border-b border-gray-200 flex justify-between items-center px-4 z-50 fixed w-full top-0 left-0 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="/admin/pages" class="text-gray-400 hover:text-blue-600"><i class="ph ph-arrow-left text-xl"></i></a>
            <input x-model="page.slug" class="bg-transparent font-mono font-bold text-sm text-gray-700 outline-none w-48" placeholder="page-slug">
        </div>
        
        <div class="flex items-center bg-gray-100 rounded-lg p-1">
            <button @click="setDevice('desktop')" class="p-1.5 rounded-md hover:bg-white transition"><i class="ph ph-desktop"></i></button>
            <button @click="setDevice('mobile')" class="p-1.5 rounded-md hover:bg-white transition"><i class="ph ph-device-mobile"></i></button>
            <div class="w-px h-4 bg-gray-300 mx-2"></div>
            <button @click="cmd('core:preview')" class="p-1.5 hover:text-blue-600"><i class="ph ph-eye"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button @click="showSettings=true" class="bg-gray-100 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2"><i class="ph ph-gear-six"></i> Config</button>
            <button @click="savePage" :disabled="loading" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
                <span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span>
            </button>
        </div>
    </header>

    <div id="gjs"></div>
    
    <div class="sidebar-desktop">
        <div class="flex border-b">
            <button @click="tab='blocks'" :class="tab=='blocks'?'text-blue-600 border-b-2 border-blue-600':''" class="flex-1 p-3"><i class="ph ph-squares-four"></i></button>
            <button @click="tab='styles'" :class="tab=='styles'?'text-blue-600 border-b-2 border-blue-600':''" class="flex-1 p-3"><i class="ph ph-paint-brush"></i></button>
            <button @click="tab='traits'" :class="tab=='traits'?'text-blue-600 border-b-2 border-blue-600':''" class="flex-1 p-3"><i class="ph ph-sliders"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-2">
            <div x-show="tab=='blocks'" id="blocks-container"></div>
            <div x-show="tab=='styles'" id="styles-container"></div>
            <div x-show="tab=='traits'" id="traits-container"></div>
        </div>
    </div>

    <script>
    function editorApp() {
        return {
            loading: false, showSettings: false, tab: 'blocks',
            page: { slug: '', title: '', product_type: 'physical', config: {} },

            async init() {
                const params = new URLSearchParams(window.location.search);
                this.page.slug = params.get('slug');
                
                // Init GrapesJS
                window.editor = grapesjs.init({
                    container: '#gjs', height: '100%', fromElement: false, storageManager: false,
                    canvas: {
                        styles: ['https://cdn.tailwindcss.com'] // CSS di Canvas
                    },
                    plugins: ['gjs-blocks-basic', 'grapesjs-plugin-forms'],
                    blockManager: { appendTo: '#blocks-container' },
                    styleManager: { appendTo: '#styles-container' },
                    traitManager: { appendTo: '#traits-container' },
                    selectorManager: { appendTo: '#styles-container' }, 
                });

                // --- SMART CONTACT FORM BLOCK ---
                const bm = window.editor.BlockManager;
                
                // Form HTML
                const contactFormHTML = `
                    <form action="/api/public/contact" method="POST" class="p-6 bg-white rounded-xl shadow-lg border border-gray-100 max-w-lg mx-auto">
                        <input type="hidden" name="page_id" value="0"> 
                        
                        <div class="mb-4 text-center">
                            <h3 class="text-xl font-bold text-gray-800">Hubungi Kami</h3>
                            <p class="text-sm text-gray-500">Kami siap membantu kebutuhan Anda.</p>
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Perihal</label>
                            <select name="subject" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 ring-blue-500">
                                <option value="Kontak">Kontak Umum</option>
                                <option value="Info">Minta Informasi</option>
                                <option value="Pertanyaan">Pertanyaan</option>
                                <option value="Keluhan">Keluhan</option>
                                <option value="Saran">Saran</option>
                                <option value="Kerjasama">Kerjasama</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Lengkap</label>
                            <input type="text" name="name" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 ring-blue-500" placeholder="Nama Anda">
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email</label>
                                <input type="email" name="email" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 ring-blue-500" placeholder="email@contoh.com">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">WhatsApp</label>
                                <input type="tel" name="phone" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 ring-blue-500" placeholder="0812...">
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Pesan Anda</label>
                            <textarea name="message" required rows="4" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 ring-blue-500" placeholder="Tulis pesan Anda disini..."></textarea>
                        </div>

                        <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                            KIRIM PESAN
                        </button>
                    </form>
                `;

                bm.add('contact-pro', {
                    label: 'Contact Pro',
                    category: 'Forms',
                    media: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
                    content: contactFormHTML
                });

                // Load Data
                if (this.page.slug) {
                    fetch('/api/admin/pages/' + this.page.slug).then(r=>r.json()).then(d=>{
                        if(d.id) {
                            this.page = { ...this.page, ...d, config: JSON.parse(d.product_config_json||'{}') };
                            if(d.html_content) window.editor.setComponents(d.html_content);
                            if(d.css_content) window.editor.setStyle(d.css_content);
                        }
                    });
                }
            },

            setDevice(d) { window.editor.setDevice(d); },
            cmd(c) { window.editor.runCommand(c); },
            
            async savePage() {
                this.loading = true;
                // Inject page_id dinamis ke form sebelum simpan
                let html = window.editor.getHtml();
                html = html.replace('name="page_id" value="0"', `name="page_id" value="${this.page.id||0}"`);
                
                await fetch('/api/admin/pages', {
                    method: 'POST',
                    body: JSON.stringify({
                        slug: this.page.slug,
                        title: this.page.title,
                        html: html,
                        css: window.editor.getCss(),
                        product_config: this.page.config
                    })
                });
                this.loading = false;
                alert('Tersimpan!');
            }
        };
    }
    </script>
</body>
</html>
