<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LandingBuilder - Pro Mobile Editor</title>
    
    <script>
        (function() {
            const originalWarn = console.warn;
            console.warn = function(...args) {
                const msg = args[0];
                if (typeof msg === 'string' && (msg.includes('cdn.tailwindcss.com') || msg.includes('production'))) return;
                originalWarn.apply(console, args);
            };
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script> 
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tabs@1.0.6"></script>
    <script src="https://unpkg.com/grapesjs-custom-code@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tooltip@0.1.7"></script>
    <script src="https://unpkg.com/grapesjs-blocks-flexbox@0.1.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-export@1.0.11"></script>
    <script src="https://unpkg.com/grapesjs-typed@1.0.5"></script>
    <script src="https://unpkg.com/grapesjs-style-bg@2.0.1"></script>

    <style>
        /* 1. RESET & CORE LAYOUT */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; }
        [x-cloak] { display: none !important; }

        /* 2. HEADER & NAVIGATION */
        header {
            height: 60px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100;
            background: white; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        }

        /* 3. MOBILE TOOLS BAR */
        .mobile-tools {
            display: none; height: 50px; width: 100%; position: fixed; top: 60px; left: 0; z-index: 90;
            background: #f8fafc; border-bottom: 1px solid #e2e8f0;
            align-items: center; justify-content: center; gap: 15px;
        }

        /* 4. WORKSPACE */
        .workspace { position: absolute; top: 60px; bottom: 0; left: 0; right: 0; background: #f3f4f6; overflow: hidden; display: flex; }
        #gjs { position: relative !important; flex: 1; height: 100% !important; width: auto !important; min-width: 0; overflow: hidden; }

        /* 5. SIDEBAR */
        .sidebar-panel {
            position: relative; width: 320px; height: 100%; background: white; border-left: 1px solid #e2e8f0;
            z-index: 50; display: flex; flex-direction: column; flex-shrink: 0;
        }

        /* 6. RESPONSIVE MOBILE FIXES */
        @media (max-width: 768px) {
            .mobile-tools { display: flex; }
            .workspace { top: 110px; } 
            #gjs { right: 0 !important; bottom: 60px !important; }
            .sidebar-panel {
                position: fixed; right: 0; top: 110px; bottom: 60px; width: 100% !important;
                z-index: 9999 !important; transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar-panel.open { transform: translateX(0); }
            .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; top: 110px; bottom: 60px; display: none; }
            .mobile-overlay.show { display: block; }
        }

        /* 7. UI CLEANUP & BLOCKS */
        .gjs-pn-views-container, .gjs-pn-panels, .gjs-pn-views, .gjs-pn-commands { display: none !important; width: 0 !important; }
        .gjs-cv-canvas { width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; }
        .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
        .gjs-block { 
            width: 100% !important; min-height: 90px !important; padding: 12px 8px !important; background: #fff; 
            border: 1px solid #e5e7eb; border-radius: 12px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: 0.2s;
        }
        .gjs-block:active { transform: scale(0.95); background: #f5f3ff; }
        .custom-scroll { overflow-y: auto; height: 100%; -webkit-overflow-scrolling: touch; }
        .gjs-selected { outline: 2px solid #6366f1 !important; outline-offset: -2px; }

        /* 8. TOOLTIP & RESIZER */
        .gjs-toolbar { background-color: #4f46e5 !important; border-radius: 8px !important; display: flex !important; }
        .gjs-toolbar-item { padding: 8px 10px !important; color: white !important; }
        .gjs-resizer-h { width: 20px !important; height: 20px !important; background: #4f46e5 !important; border: 3px solid #fff !important; border-radius: 50% !important; z-index: 10 !important; }
    </style>
</head>
<body x-data="editorApp()">

    <div class="fixed bottom-20 left-5 z-[9999] flex flex-col gap-2 pointer-events-none">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border-l-4 bg-white min-w-[250px]" :class="n.type==='success'?'border-green-500':'border-red-500'">
                <i class="ph text-xl" :class="n.type==='success'?'ph-check-circle text-green-500':'ph-warning-circle text-red-500'"></i>
                <div><h4 class="text-xs font-bold text-gray-800" x-text="n.title"></h4><p class="text-[10px] text-gray-500" x-text="n.msg"></p></div>
            </div>
        </template>
    </div>

    <header>
        <div class="flex items-center gap-3 overflow-hidden w-full max-w-[250px]">
            <a href="/admin/pages" class="text-gray-400 hover:text-indigo-600 transition p-1.5 rounded shrink-0"><i class="ph ph-arrow-left text-xl"></i></a>
            <div class="flex-1 min-w-0">
                <input x-model="page.title" class="bg-transparent font-bold text-xs text-gray-800 outline-none w-full truncate" placeholder="Nama Halaman">
                <div class="flex items-center gap-1">
                    <span class="text-[8px] font-black text-gray-300 uppercase tracking-tighter shrink-0">Slug:</span>
                    <input x-model="page.slug" class="bg-transparent font-mono text-[9px] text-gray-400 outline-none w-full truncate" placeholder="slug-halaman">
                </div>
            </div>
        </div>

        <div class="hidden md:flex absolute left-1/2 transform -translate-x-1/2 items-center bg-gray-100 rounded-lg p-1 border shadow-sm">
            <button @click="setDevice('desktop')" :class="device=='desktop'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-desktop text-lg"></i></button>
            <button @click="setDevice('tablet')" :class="device=='tablet'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-tablet text-lg"></i></button>
            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <div class="hidden md:flex items-center gap-2">
                <button @click="showSettings=true" class="bg-white text-gray-600 px-3 py-2 rounded-lg text-xs font-bold border border-gray-200 hover:bg-gray-50 transition">Config</button>
                <button @click="savePage" :disabled="loading" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition">
                    <span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span>
                </button>
            </div>
            <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 rounded-lg border border-gray-200 text-gray-700" :class="mobileMenuOpen ? 'bg-indigo-50 text-indigo-600' : 'bg-white'">
                <i class="ph" :class="mobileMenuOpen ? 'ph-x' : 'ph-list'" style="font-size: 24px;"></i>
            </button>
        </div>
    </header>

    <div class="mobile-tools">
        <button @click="setDevice('desktop')" :class="device=='desktop'?'text-indigo-600 bg-white shadow-sm':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-desktop text-lg"></i></button>
        <button @click="setDevice('tablet')" :class="device=='tablet'?'text-indigo-600 bg-white shadow-sm':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-tablet text-lg"></i></button>
        <button @click="setDevice('mobile')" :class="device=='mobile'?'text-indigo-600 bg-white shadow-sm':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>
        <div class="w-px h-4 bg-gray-300"></div>
        <button @click="cmd('core:undo')" class="text-gray-500"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
        <button @click="cmd('core:redo')" class="text-gray-500"><i class="ph ph-arrow-u-up-right text-lg"></i></button>
    </div>

    <div class="workspace">
        <div id="gjs"></div>
        <div class="mobile-overlay md:hidden" :class="mobileMenuOpen ? 'show' : ''" @click="mobileMenuOpen = false"></div>
        <div class="sidebar-panel" :class="mobileMenuOpen ? 'open' : ''">
            <div class="flex border-b border-gray-200 bg-white shrink-0">
                <button @click="tab='blocks'" :class="tab=='blocks'?'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600':'text-gray-400'" class="flex-1 p-3 transition"><i class="ph ph-squares-four text-xl"></i></button>
                <button @click="tab='styles'" :class="tab=='styles'?'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600':'text-gray-400'" class="flex-1 p-3 transition"><i class="ph ph-paint-brush text-xl"></i></button>
                <button @click="tab='traits'" :class="tab=='traits'?'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600':'text-gray-400'" class="flex-1 p-3 transition"><i class="ph ph-sliders text-xl"></i></button>
                <button @click="tab='layers'" :class="tab=='layers'?'text-indigo-600 bg-indigo-50 border-b-2 border-indigo-600':'text-gray-400'" class="flex-1 p-3 transition"><i class="ph ph-stack text-xl"></i></button>
            </div>
            <div class="flex-1 bg-white custom-scroll relative w-full">
                <div x-show="tab=='blocks'" class="h-full pb-20"><div id="blocks-container" class="p-2"></div></div>
                <div x-show="tab=='styles'" class="h-full pb-20"><div id="selectors-container" class="p-3"></div><div id="styles-container" class="p-1"></div></div>
                <div x-show="tab=='traits'" class="h-full pb-20"><div id="traits-container" class="p-4"></div></div>
                <div x-show="tab=='layers'" class="h-full pb-20"><div id="layers-container"></div></div>
            </div>
        </div>
    </div>

    <div class="md:hidden fixed bottom-0 left-0 w-full h-[60px] bg-white border-t border-gray-200 flex items-center justify-around z-[300] px-2 shadow-lg">
        <button @click="cmd('core:preview')" class="flex flex-col items-center justify-center w-16 text-gray-500">
            <i class="ph ph-eye text-2xl"></i><span class="text-[9px] font-bold">View</span>
        </button>
        <button @click="showSettings=true" class="flex flex-col items-center justify-center w-16 text-gray-500">
            <i class="ph ph-gear-six text-2xl"></i><span class="text-[9px] font-bold">Config</span>
        </button>
        <button @click="savePage" :disabled="loading" class="flex items-center justify-center gap-2 bg-indigo-600 text-white px-6 py-2 rounded-full shadow-lg">
            <i x-show="!loading" class="ph ph-paper-plane-right-fill text-xl"></i>
            <span x-show="loading" class="ph ph-spinner animate-spin text-xl"></span>
            <span class="font-bold text-xs uppercase">Publish</span>
        </button>
    </div>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[400] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="w-full md:w-[480px] h-full bg-white shadow-2xl flex flex-col border-l">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="ph ph-faders text-indigo-600 text-xl"></i> Page Settings</h2>
                <button @click="showSettings = false" class="text-gray-400 hover:text-red-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="flex border-b text-[11px] font-black uppercase bg-white">
                <button @click="settingsTab='commerce'" :class="settingsTab==='commerce'?'border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50':'text-gray-400'" class="flex-1 py-4">Commerce</button>
                <button @click="settingsTab='seo'" :class="settingsTab==='seo'?'border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50':'text-gray-400'" class="flex-1 py-4">SEO</button>
                <button @click="settingsTab='advanced'" :class="settingsTab==='advanced'?'border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50':'text-gray-400'" class="flex-1 py-4">Scripts</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <div x-show="settingsTab === 'commerce'" class="space-y-4">
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Nama Halaman</label>
                    <input x-model="page.title" class="w-full mt-1 px-4 py-3 bg-gray-50 border rounded-xl text-sm outline-none focus:border-indigo-500"></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">URL Slug</label>
                    <input x-model="page.slug" class="w-full mt-1 px-4 py-3 bg-gray-50 border rounded-xl text-sm outline-none focus:border-indigo-500"></div>
                </div>
                <div x-show="settingsTab === 'seo'" class="space-y-4">
                    <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Favicon</label>
                        <div class="flex gap-2 mt-2">
                            <input x-model="page.meta.favicon" class="flex-1 px-4 py-2 bg-white border rounded-lg text-xs outline-none" placeholder="URL Favicon...">
                            <button @click="$refs.faviconInput.click()" class="w-10 h-10 bg-indigo-600 text-white rounded-lg flex items-center justify-center hover:bg-indigo-700 transition">
                                <i class="ph ph-cloud-arrow-up text-xl"></i>
                            </button>
                            <input type="file" x-ref="faviconInput" class="hidden" accept="image/*" @change="uploadToCloudinary($event, 'favicon')">
                        </div>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest text-xs">Social Share Image (OG)</label>
                        <div class="flex gap-2 mt-2">
                            <input x-model="page.meta.og_image" class="flex-1 px-4 py-2 bg-white border rounded-lg text-xs outline-none" placeholder="URL Gambar Share...">
                            <button @click="$refs.ogInput.click()" class="w-10 h-10 bg-slate-800 text-white rounded-lg flex items-center justify-center hover:bg-black transition">
                                <i class="ph ph-image-plus text-xl"></i>
                            </button>
                            <input type="file" x-ref="ogInput" class="hidden" accept="image/*" @change="uploadToCloudinary($event, 'og_image')">
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button @click="showSettings=false" class="px-5 py-2 text-xs font-bold text-gray-500 uppercase">Cancel</button>
                <button @click="savePage(); showSettings=false" class="px-8 py-2 bg-indigo-600 text-white text-xs font-black rounded-xl shadow-lg">Simpan</button>
            </div>
        </div>
    </div>

    <div id="iconify-picker-modal" class="fixed inset-0 hidden z-[99999] bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">
        <div class="bg-white rounded-xl w-full max-w-xl shadow-2xl overflow-hidden mt-10">
            <div class="flex items-center justify-between p-4 border-b bg-gray-50">
                <input id="iconify-picker-search" placeholder="Search icon..." class="w-full bg-transparent outline-none text-sm" />
                <button id="iconify-picker-close"><i class="ph ph-x text-lg"></i></button>
            </div>
            <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto"></div>
        </div>
    </div>
    
    <script>
// --- ICON PICKER LOGIC ---
(function(){
    let activeModel = null; const modal = document.getElementById('iconify-picker-modal'); const input = document.getElementById('iconify-picker-search'); const results = document.getElementById('iconify-picker-results');
    window.openIconifyPicker = function(model) { activeModel = model; modal.classList.remove('hidden'); input.value = ''; input.focus(); searchIcons('star'); };
    document.getElementById('iconify-picker-close').onclick = () => modal.classList.add('hidden'); input.oninput = (e) => searchIcons(e.target.value);
    async function searchIcons(q) { if(!q) return; const res = await fetch(`https://api.iconify.design/search?query=${q}&limit=18`); const data = await res.json(); results.innerHTML = ''; if(data.icons) { data.icons.forEach(icon => { const btn = document.createElement('button'); btn.className = 'p-2 hover:bg-indigo-50 rounded flex flex-col items-center gap-1'; btn.innerHTML = `<iconify-icon icon="${icon}" width="24"></iconify-icon><span class="text-[9px] text-gray-400 truncate w-full text-center">${icon.split(':')[1]}</span>`; btn.onclick = () => { if(activeModel) activeModel.setAttributes({ icon: icon }); modal.classList.add('hidden'); }; results.appendChild(btn); }); } }
})();

// --- APP LOGIC ---
function editorApp() {
    return {
        device: 'desktop',
        tab: 'blocks',
        clipboard: null,
        mobileMenuOpen: false,
        showSettings: false,
        settingsTab: 'commerce',
        loading: false,
        notifications: [],
        paymentProviders: [],

        page: { 
            id: 0, slug: '', title: '', product_type: 'physical', slug_payment: 'whatsapp',
            meta: { description: '', keywords: '', og_image: '', favicon: '' },
            analytics: { fb_pixel: '', ga_id: '', tiktok_pixel: '' },
            scripts: { header: '', footer: '' },
            config: { price: 0, variants: [], shipping: { weight: 1000, cod: false }, order_bump: { active: false }, coupons: [], settings: {}, active_payments: [] } 
        },

        async init() {
            this.initGrapes();
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if (slug) { await this.loadPageData(slug); } 
            else { this.page.slug = 'halaman-baru-' + Date.now(); this.page.title = 'Halaman Baru'; }
            await this.fetchPaymentProviders();
        },

        async loadPageData(slug) {
            this.loading = true;
            try {
                const res = await fetch(`/api/admin/pages/${slug}`, { credentials: 'same-origin' });
                const data = await res.json();
                if (data) {
                    this.page.id = data.id || 0;
                    this.page.slug = data.slug || slug;
                    this.page.title = data.title || '';
                    this.page.product_type = data.product_type || 'physical';
                    this.page.slug_payment = data.provider || 'whatsapp';
                    if (data.meta) this.page.meta = typeof data.meta === 'string' ? JSON.parse(data.meta) : data.meta;
                    if (data.analytics) this.page.analytics = typeof data.analytics === 'string' ? JSON.parse(data.analytics) : data.analytics;
                    if (data.scripts) this.page.scripts = typeof data.scripts === 'string' ? JSON.parse(data.scripts) : data.scripts;
                    let configData = typeof data.product_config_json === 'string' ? JSON.parse(data.product_config_json) : (data.product_config || {});
                    this.page.config = Object.assign(this.page.config, configData);
                    if (window.editor) {
                        if (data.html_content || data.html) window.editor.setComponents(data.html_content || data.html);
                        if (data.css_content || data.css) window.editor.setStyle(data.css_content || data.css);
                    }
                }
            } catch (e) { console.error(e); }
            this.loading = false;
        },

        async fetchPaymentProviders() {
            try { 
                const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' }); 
                const json = await res.json(); this.paymentProviders = Array.isArray(json) ? json : (json.results || []); 
            } catch (e) {}
        },

        async savePage() {
            this.loading = true;
            try {
                const html = window.editor.getHtml(); const css = window.editor.getCss(); const js = window.editor.getJs();
                const payload = {
                    id: this.page.id, slug: this.page.slug, title: this.page.title, product_type: this.page.product_type,
                    provider: this.page.slug_payment, html: `${html}<script>${js}<\/script>`, css: css,
                    meta: this.page.meta, analytics: this.page.analytics, scripts: this.page.scripts, product_config: this.page.config
                };
                const res = await fetch('/api/admin/pages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                this.notify(res.ok ? 'Sukses' : 'Error', res.ok ? 'Berhasil disimpan!' : 'Gagal simpan', res.ok ? 'success' : 'error');
            } catch (e) { this.notify('Error', 'Masalah koneksi', 'error'); }
            this.loading = false;
        },

        notify(title, msg, type = 'success') { 
            const id = Date.now(); this.notifications.push({ id, title, msg, type, show: true }); 
            setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== id); }, 3000); 
        },

        setDevice(d) { this.device = d; if (window.editor) window.editor.setDevice(d); },

        async uploadToCloudinary(event, target) {
            const file = event.target.files[0]; if (!file) return; this.loading = true;
            try {
                const formData = new FormData(); formData.append('file', file);
                const res = await fetch('/api/admin/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok && data.url) { this.page.meta[target] = data.url; this.notify('Sukses', 'Gambar diupdate!', 'success'); }
            } catch (e) { this.notify('Error', 'Gagal upload', 'error'); }
            this.loading = false; event.target.value = '';
        },

        cmd(c) { window.editor.runCommand(c); },

        initGrapes() {
            const bridgeCSS = `
                body { min-height: 100vh; background-color: #ffffff; overflow-x: hidden; }
                .product-gallery { display: flex; flex-direction: column; gap: 12px; width: 100%; overflow: hidden; }
                .gallery-main { display: flex; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; }
                .gallery-main img { width: 100%; flex-shrink: 0; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; }
                .gallery-thumbs { display: flex; flex-direction: row; gap: 10px; overflow-x: auto; padding: 5px 0; }
                .thumb-item { min-width: 70px; width: 70px; height: 70px; flex-shrink: 0; border-radius: 8px; cursor: pointer; border: 2px solid transparent; opacity: 0.6; transition: 0.3s; object-fit: cover; }
                .thumb-item.active { border-color: #4f46e5; opacity: 1; transform: scale(1.05); }
                .editable-carousel { position: relative; width: 100%; overflow: hidden; }

            domc.addType('iconify-icon', { model: { defaults: { tagName: 'iconify-icon', attributes: { icon: 'ph:star-fill', width: '32' }, traits: [{ type: 'button', text: 'Change Icon', command: (ed, t) => window.openIconifyPicker(t.target) }] } } });
            
            domc.addType('product-gallery', {
                model: { defaults: { script: function() {
                    const main = this.querySelector('.gallery-main'); const thumbs = this.querySelectorAll('.thumb-item');
                    const goTo = (i) => { if(!main) return; main.style.transform = `translateX(-${i * 100}%)`; thumbs.forEach((t, idx) => idx === i ? t.classList.add('active') : t.classList.remove('active')); };
                    thumbs.forEach((t, i) => t.onclick = () => goTo(i));
                }}}
            });

            // --- LISTENERS ---
            window.editor.on('component:dblclick', (m) => { if(m.get('tagName') === 'iconify-icon') window.openIconifyPicker(m); });
            
            window.editor.on('component:selected', (model) => {
                const toolbar = model.get('toolbar'); if (toolbar.find(item => item.id === 'cut-comp')) return;
                toolbar.unshift(
                    { id: 'move-up', command: () => { const i = model.index(); if (i > 0) model.parent().components().add(model, { at: i - 1 }); }, label: '<i class="ph ph-arrow-up"></i>' },
                    { id: 'move-down', command: () => { const i = model.index(); model.parent().components().add(model, { at: i + 2 }); }, label: '<i class="ph ph-arrow-down"></i>' },
                    { id: 'cut-comp', command: () => { this.clipboard = model.toHTML(); model.remove(); this.notify('Cut', 'Komponen dipotong', 'info'); }, label: '<i class="ph ph-scissors"></i>' },
                    { id: 'paste-inside', command: () => { if (this.clipboard) { model.append(this.clipboard); this.notify('Sukses', 'Berhasil disisipkan', 'success'); } } }
                );
                model.set('toolbar', toolbar);
            });

            // --- CLICK-TO-ADD ---
            setTimeout(() => {
                const container = document.getElementById('blocks-container');
                if (container) {
                    container.addEventListener('click', (e) => {
                        const blockEl = e.target.closest('.gjs-block');
                        if (blockEl) {
                            const id = blockEl.getAttribute('title') || blockEl.innerText.trim();
                            const block = window.editor.BlockManager.get(id);
                            if (block) {
                                window.editor.addComponents(block.get('content'));
                                if(window.innerWidth < 768) this.mobileMenuOpen = false;
                            }
                        }
                    });
                }
            }, 1500); 
        }
    };
