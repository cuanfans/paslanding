<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingBuilder - Ultimate Fixed</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script> 
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-component-countdown@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tabs@1.0.6"></script>
    <script src="https://unpkg.com/grapesjs-custom-code@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tooltip@0.1.7"></script>
    <script src="https://unpkg.com/grapesjs-blocks-flexbox@0.1.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-export@1.0.11"></script>
    <script src="https://unpkg.com/grapesjs-typed@1.0.5"></script>
    <script src="https://unpkg.com/grapesjs-style-bg@2.0.1"></script>

    <style>
        /* UI EDITOR STYLES */
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; color: #1e293b; }
        [x-cloak] { display: none !important; }
        
        .gjs-pn-top-panel, .gjs-pn-views-container, .gjs-pn-views { display: none !important; }
        
        .gjs-cv-canvas { width: calc(100% - 320px) !important; height: calc(100% - 60px) !important; top: 60px !important; left: 0 !important; background-color: #f3f4f6; box-shadow: inset 0 0 20px rgba(0,0,0,0.05); }
        .gjs-selected { outline: 2px solid #6366f1 !important; outline-offset: -2px; }
        .gjs-color-picker { z-index: 99999 !important; }
        
        .sidebar-desktop { position: fixed; top: 60px; right: 0; bottom: 0; width: 320px; background: white; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 100; }
        .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
        .gjs-block { width: 100% !important; min-height: auto !important; padding: 10px 8px !important; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: grab; transition: all 0.2s; box-shadow: 0 1px 1px rgba(0,0,0,0.05); }
        .gjs-block:hover { border-color: #6366f1; color: #6366f1; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2); }
        .gjs-block-label { font-size: 9px; font-weight: 600; text-align: center; color: #4b5563; }
        .gjs-block-category .gjs-title { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 8px 12px; font-size: 10px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

        ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .panel-tabs button.active { color: #6366f1; border-bottom: 2px solid #6366f1; background: #eef2ff; }
        .input-std { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; }
        .input-std:focus { border-color: #6366f1; ring: 2px solid #e0e7ff; }
        
        /* Hide Default GrapesJS Blocks */
        .gjs-block[title="Form"], .gjs-block[title="Input"], .gjs-block[title="Textarea"], .gjs-block[title="Select"], .gjs-block[title="Button"], .gjs-block[title="Label"], .gjs-block[title="Checkbox"], .gjs-block[title="Radio"], .gjs-block[title="Text"], .gjs-block[title="Link"], .gjs-block[title="Image"], .gjs-block[title="Video"], .gjs-block[title="Map"] { display: none !important; }
    </style>
</head>

<body x-data="editorApp()">

    <div class="fixed bottom-5 left-5 z-[9999] flex flex-col gap-2 pointer-events-none">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border-l-4 bg-white min-w-[250px]" :class="n.type==='success'?'border-green-500':'border-red-500'">
                <i class="ph text-xl" :class="n.type==='success'?'ph-check-circle text-green-500':'ph-warning-circle text-red-500'"></i>
                <div><h4 class="text-xs font-bold text-gray-800" x-text="n.title"></h4><p class="text-[10px] text-gray-500" x-text="n.msg"></p></div>
            </div>
        </template>
    </div>

    <header class="h-[60px] bg-white border-b border-gray-200 flex justify-between items-center px-4 z-50 relative shrink-0">
        <div class="flex items-center gap-4">
            <a href="/admin/pages" class="text-gray-400 hover:text-indigo-600 transition"><i class="ph ph-arrow-left text-xl"></i></a>
            <div><span class="text-[10px] font-bold text-gray-400 uppercase block mb-0.5">Page URL</span><input x-model="page.slug" class="bg-transparent font-mono font-bold text-sm text-gray-700 outline-none w-48 placeholder-gray-300 focus:text-indigo-600 transition" placeholder="nama-halaman"></div>
        </div>
        <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
            <button @click="setDevice('desktop')" :class="device=='desktop'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-desktop text-lg"></i></button>
            <button @click="setDevice('tablet')" :class="device=='tablet'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-tablet text-lg"></i></button>
            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>
            <div class="w-px h-5 bg-gray-300 mx-2"></div>
            <button @click="cmd('core:preview')" class="text-gray-500 hover:text-indigo-600 p-1.5"><i class="ph ph-eye text-lg"></i></button>
            <button @click="cmd('core:undo')" class="text-gray-400 hover:text-gray-700 p-1.5"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
            <button @click="cmd('core:redo')" class="text-gray-400 hover:text-gray-700 p-1.5"><i class="ph ph-arrow-u-up-right text-lg"></i></button>
        </div>
        <div class="flex items-center gap-3">
            <button @click="showSettings=true" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-gray-200 transition"><i class="ph ph-gear-six text-lg"></i> Config</button>
            <button @click="savePage" :disabled="loading" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-indigo-500/30"><i x-show="loading" class="ph ph-spinner animate-spin"></i><span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span></button>
        </div>
    </header>

    <div class="flex h-[calc(100vh-60px)] overflow-hidden relative">
        <div class="flex-1 relative bg-[#f3f4f6] overflow-hidden"><div id="gjs" class="w-full h-full"></div></div>
        <div class="sidebar-desktop">
            <div class="panel-tabs flex border-bottom border-gray-200 bg-white">
                <button @click="tab='blocks'" :class="tab=='blocks'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Blocks"><i class="ph ph-squares-four text-xl"></i></button>
                <button @click="tab='styles'" :class="tab=='styles'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Styles"><i class="ph ph-paint-brush text-xl"></i></button>
                <button @click="tab='traits'" :class="tab=='traits'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Settings"><i class="ph ph-sliders text-xl"></i></button>
                <button @click="tab='layers'" :class="tab=='layers'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Layers"><i class="ph ph-stack text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto bg-white relative custom-scroll">
                <div x-show="tab=='blocks'" id="blocks-container" class="absolute inset-0 pb-20"></div>
                <div x-show="tab=='styles'"><div id="selectors-container" class="p-3 border-b bg-gray-50"></div><div id="styles-container" class="pb-20"></div></div>
                <div x-show="tab=='traits'"><div class="p-3 bg-gray-50 text-gray-500 text-[10px] font-bold uppercase tracking-widest border-b">Element Settings</div><div id="traits-container" class="p-2 pb-20"></div></div>
                <div x-show="tab=='layers'" id="layers-container" class="absolute inset-0 pb-20"></div>
            </div>
        </div>
    </div>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[200] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="w-[450px] h-full bg-white shadow-2xl flex flex-col border-l border-gray-200" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="ph ph-faders text-indigo-600 text-xl"></i> Page Config</h2>
                <button @click="showSettings = false" class="text-gray-400 hover:text-red-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll bg-white">
                <div><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Product Type</h3><div class="flex bg-gray-100 p-1 rounded-lg"><button @click="page.product_type='physical'" :class="page.product_type=='physical'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Physical</button><button @click="page.product_type='digital'" :class="page.product_type=='digital'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Digital</button></div></div>
                <div><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Payment</h3><select x-model="page.slug_payment" class="input-std bg-white"><option value="whatsapp">WhatsApp Manual</option><template x-for="p in paymentProviders" :key="p.slug"><option :value="p.slug" x-text="p.name"></option></template></select></div>
                <div><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Price</h3><input x-model="page.config.price" type="number" class="input-std" placeholder="0"></div>
                </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2"><button @click="showSettings=false" class="px-4 py-2 text-xs font-bold text-gray-500">TUTUP</button><button @click="savePage(); showSettings=false" class="px-6 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700">SIMPAN</button></div>
        </div>
    </div>

    <div id="iconify-picker-modal" class="fixed inset-0 hidden z-[99999] bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">
      <div class="bg-white rounded-xl w-full max-w-xl shadow-2xl overflow-hidden mt-10">
        <div class="flex items-center justify-between p-4 border-b bg-gray-50"><input id="iconify-picker-search" placeholder="Search icon..." class="w-full bg-transparent outline-none text-sm" /><button id="iconify-picker-close"><i class="ph ph-x text-lg"></i></button></div>
        <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto"></div>
      </div>
    </div>

<script>
// --- ICON PICKER LOGIC ---
(function(){
    let activeModel = null; const modal = document.getElementById('iconify-picker-modal'); const input = document.getElementById('iconify-picker-search'); const results = document.getElementById('iconify-picker-results');
    window.openIconifyPicker = function(model) { activeModel = model; modal.classList.remove('hidden'); input.value = ''; input.focus(); searchIcons('star'); };
    document.getElementById('iconify-picker-close').onclick = () => modal.classList.add('hidden'); input.oninput = (e) => searchIcons(e.target.value);
    async function searchIcons(q) { if(!q) return; const res = await fetch(`https://api.iconify.design/search?query=${q}&limit=18`); const data = await res.json(); results.innerHTML = ''; if(data.icons) { data.icons.forEach(icon => { const btn = document.createElement('button'); btn.className = 'p-2 hover:bg-indigo-50 rounded flex flex-col items-center gap-1'; btn.innerHTML = `<iconify-icon icon="${icon}" width="24"></iconify-icon><span class="text-[9px] text-gray-400 truncate w-full text-center">${icon.split(':')[1]}</span>`; btn.onclick = () => { if(activeModel) activeModel.setAttributes({ icon: icon }); modal.classList.add('hidden'); }; results.appendChild(btn); }); } }
})();

// --- APP LOGIC ---
function editorApp() {
    return {
        loading: false, showSettings: false, device: 'desktop', tab: 'blocks', notifications: [], paymentProviders: [],
        page: { slug: '', title: '', product_type: 'physical', slug_payment: 'whatsapp', config: { price: 0, variants: [], shipping: { weight: 1000, cod: false }, order_bump: { active: false }, coupons: [], settings: {}, active_payments: [] } },

        async init() {
            const params = new URLSearchParams(window.location.search); this.page.slug = params.get('slug'); await this.fetchPaymentProviders(); this.initGrapes();
        },
        async fetchPaymentProviders() { try { const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' }); if (res.status === 401) return; const json = await res.json(); if (Array.isArray(json)) this.paymentProviders = json; else if (json.results) this.paymentProviders = json.results; } catch (e) {} },
        async savePage() {
            this.loading = true;
            try {
                let html = window.editor.getHtml();
                html = html.replace('name="page_id" value="0"', `name="page_id" value="${this.page.id||0}"`); // Inject ID
                const res = await fetch('/api/admin/pages', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: this.page.slug, title: this.page.title, product_type: this.page.product_type, provider: this.page.slug_payment, html: html, css: window.editor.getCss(), product_config: this.page.config }) });
                if (res.status === 401) { window.location.href = '/login'; return; }
                this.notify(res.ok ? 'Sukses' : 'Error', res.ok ? 'Tersimpan!' : 'Gagal simpan', res.ok ? 'success' : 'error');
            } catch (e) { this.notify('Error', 'Gagal simpan', 'error'); }
            this.loading = false;
        },
        notify(title, msg, type = 'success') { const id = Date.now(); this.notifications.push({ id, title, msg, type, show: true }); setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== id); }, 3000); },
        setDevice(d) { this.device = d; window.editor.setDevice(d); },
        cmd(c) { window.editor.runCommand(c); },

        initGrapes() {
            // === BRIDGE INJECTION CSS (CRITICAL UNTUK TAMPILAN) ===
            const widgetStyles = `
                /* Pricing & Testimonial Cards */
                .pricing-card, .testimonial-card { background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); border-radius: 12px; padding: 24px; border: 1px solid #e6eef8; box-shadow: 0 8px 24px rgba(14,42,71,0.06); display:flex; flex-direction:column; gap:12px; height:100%; }
                .pricing-card .title { font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:0.6px; color:#475569; }
                .pricing-card .price { font-size:32px; font-weight:900; color:#0f172a; margin:10px 0; }
                .pricing-card.highlight { border:2px solid #2563eb; transform:translateY(-5px); z-index:10; }
                
                /* Carousel & Thumbnails */
                .editable-carousel { position: relative; overflow: hidden; border-radius:12px; width: 100%; }
                .editable-carousel .slides { display:flex; transition: transform 0.5s ease; will-change: transform; height: 100%; }
                .editable-carousel .slide { min-width:100%; flex: 0 0 100%; position:relative; height: 100%; }
                .editable-carousel .slide img { width:100%; height:100%; object-fit:cover; display:block; }
                
                /* Thumbnail Gallery Specific */
                .product-gallery { display:flex; flex-direction:column; gap:10px; }
                .product-gallery .main-img { border-radius:12px; overflow:hidden; width:100%; aspect-ratio:1/1; }
                .product-gallery .thumbs { display:flex; gap:8px; overflow-x:auto; }
                .product-gallery .thumb { width:60px; height:60px; border-radius:8px; cursor:pointer; opacity:0.6; transition:all 0.2s; border:2px solid transparent; }
                .product-gallery .thumb:hover, .product-gallery .thumb.active { opacity:1; border-color:#2563eb; }

                /* Utils */
                .scrollbar-hide::-webkit-scrollbar { display: none; }
                @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
                .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; }
            `;

            window.editor = grapesjs.init({
                container: '#gjs', height: '100%', fromElement: false, storageManager: false,
                canvas: {
                    scripts: ['https://cdn.tailwindcss.com', 'https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js'],
                    styles: ['https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap', 'https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css'],
                    content: `<style>${widgetStyles}</style><script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { theme: { 50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 800:'#3730a3' } } } } }<\/script>`
                },
                plugins: ['gjs-blocks-basic', 'grapesjs-plugin-forms', 'grapesjs-navbar', 'grapesjs-component-countdown', 'grapesjs-tabs', 'grapesjs-custom-code', 'grapesjs-tooltip', 'grapesjs-blocks-flexbox', 'grapesjs-plugin-export', 'grapesjs-typed', 'grapesjs-style-bg'],
                deviceManager: { devices: [{ id: 'desktop', width: '' }, { id: 'tablet', width: '768px' }, { id: 'mobile', width: '375px' }] },
                blockManager: { appendTo: '#blocks-container' },
                layerManager: { appendTo: '#layers-container' },
                selectorManager: { appendTo: '#selectors-container' },
                traitManager: { appendTo: '#traits-container' },
                styleManager: { appendTo: '#styles-container', sectors: [{ name: 'Typography', open:true, buildProps:['font-family','font-size','font-weight','color','text-align'] }, { name: 'Decorations', open:false, buildProps:['background-color','border','border-radius','box-shadow'] }] }
            });

            // --- LOAD DATA ---
            if (this.page.slug) {
                fetch('/api/admin/pages/' + this.page.slug, { credentials: 'same-origin' }).then(r=>r.json()).then(d=>{
                    if(d.id) {
                        this.page.title = d.title; this.page.product_type = d.product_type || 'physical'; this.page.slug_payment = d.provider || 'whatsapp';
                        this.page.id = d.id; 
                        try { const c = JSON.parse(d.product_config_json || '{}'); this.page.config = Object.assign(this.page.config, c); } catch (e) {}
                        if (d.html_content) window.editor.setComponents(d.html_content);
                        if (d.css_content) window.editor.setStyle(d.css_content);
                    }
                }).catch(()=>{});
            }

            const domc = window.editor.DomComponents;
            const bm = window.editor.BlockManager;

            // --- COMPONENT LOGIC ---
            domc.addType('iconify-icon', { model: { defaults: { tagName: 'iconify-icon', droppable: false, attributes: { icon: 'ph:star-fill', width: '32', class: 'text-yellow-400' }, traits: [{ type: 'button', text: '🔍 Change Icon', full: true, command: (ed, trait) => window.openIconifyPicker(trait.target) }, { name: 'width', type: 'number', label: 'Size' }, { name: 'class', label: 'Class' }] } } });
            window.editor.on('component:dblclick', (model) => { if(model.get('tagName') === 'iconify-icon') window.openIconifyPicker(model); });
            
            // CAROUSEL LOGIC
            domc.addType('editable-carousel', { model: { defaults: { script: function() { 
                const el = this; const slides = el.querySelector('.slides'); const items = el.querySelectorAll('.slide'); let idx = 0; 
                function show(n) { idx = (n + items.length) % items.length; slides.style.transform = 'translateX(-'+(idx*100)+'%)'; } 
                const next = el.querySelector('.next'); if(next) next.onclick = () => show(idx+1); 
                const prev = el.querySelector('.prev'); if(prev) prev.onclick = () => show(idx-1); 
                setInterval(() => show(idx+1), 6000); 
            } } } });

            // THUMBNAIL GALLERY LOGIC (NEW)
            domc.addType('product-gallery', { model: { defaults: { script: function() {
                const el = this; const main = el.querySelector('.main-img img'); const thumbs = el.querySelectorAll('.thumb');
                thumbs.forEach(t => {
                    t.onclick = function() {
                        main.src = this.src;
                        thumbs.forEach(x => x.classList.remove('active'));
                        this.classList.add('active');
                    }
                });
            } } } });

            // --- BLOCK DEFINITIONS (RESTORED ALL) ---
            
            // 1. HEADER & HERO
            const headerStyle = "position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-bottom:1px solid #e5e7eb;";
            bm.add('header-sticky', { label: 'Header Sticky', category: '1. Header & Hero', content: `<header style="${headerStyle}"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><div class="font-bold text-2xl text-indigo-600">Brand.</div><nav class="hidden md:flex gap-6"><a href="#" class="text-sm font-medium hover:text-indigo-600">Fitur</a><a href="#" class="text-sm font-medium hover:text-indigo-600">Harga</a></nav><button class="btn btn-primary btn-sm">Beli</button></div></header>` });
