<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingBuilder - Ultimate Fixed</title>
    
    <script>
        (function() {
            const originalWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
                originalWarn.apply(console, args);
            };
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script> 
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-component-countdown@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tabs@1.0.6"></script>
    <script src="https://unpkg.com/grapesjs-custom-code@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tooltip@0.1.7"></script>
    <script src="https://unpkg.com/grapesjs-blocks-flexbox@0.1.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-export@1.0.11"></script>
    <script src="https://unpkg.com/grapesjs-typed@1.0.5"></script>
    <script src="https://unpkg.com/grapesjs-style-bg@2.0.1"></script>

    <style>
        /* BASE STYLE */
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; color: #1e293b; }
        [x-cloak] { display: none !important; }
        
        /* HEADER STYLE */
        header {
            height: 60px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100;
            background: white; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        }

        /* CANVAS STYLE - FULL HEIGHT FIX */
        .gjs-cv-canvas { 
            top: 60px !important;
            width: calc(100% - 320px) !important; 
            height: calc(100% - 60px) !important; 
            left: 0 !important;
            background-color: #f3f4f6;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        
        /* SIDEBAR STYLE */
        /* --- SIDEBAR RESPONSIVE --- */
        .sidebar-desktop {
            position: fixed;
            top: 60px;
            right: 0;
            bottom: 0;
            width: 320px;
            background: white;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            z-index: 1000; /* Pastikan di atas canvas */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* KHUSUS MOBILE (Layar < 768px) */
        @media (max-width: 768px) {
            .sidebar-desktop {
                width: 85%; /* Lebar 85% layar HP */
                transform: translateX(100%); /* Sembunyi ke kanan scr default */
                box-shadow: -10px 0 20px rgba(0,0,0,0.1);
            }
            
            /* Class untuk memunculkan sidebar */
            .sidebar-desktop.is-open {
                transform: translateX(0);
            }
            
            /* Overlay Hitam saat sidebar buka */
            .sidebar-overlay {
                position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999;
                display: none;
            }
            .sidebar-overlay.show { display: block; }
        }

        /* GRAPESJS UI OVERRIDES */
        .gjs-pn-top-panel, .gjs-pn-views-container, .gjs-pn-views { display: none !important; }
        .gjs-selected { outline: 2px solid #2563eb !important; outline-offset: -2px; }
        
        /* BLOCKS GRID */
        .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
        .gjs-block { 
            width: 100% !important; min-height: auto !important; padding: 10px 8px !important; 
            background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            cursor: grab; transition: all 0.2s; box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        .gjs-block:hover { border-color: #6366f1; color: #6366f1; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2); }
        .gjs-block-label { font-size: 9px; font-weight: 600; text-align: center; color: #4b5563; margin-top: 4px; }
        .gjs-block-category .gjs-title { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 8px 12px; font-size: 10px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

        /* SCROLLBAR & INPUTS */
        ::-webkit-scrollbar { width: 5px; height: 5px; } 
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .panel-tabs button.active { color: #6366f1; border-bottom: 2px solid #6366f1; background: #eef2ff; }
        .input-std { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; transition: 0.2s; }
        .input-std:focus { border-color: #6366f1; ring: 2px solid #e0e7ff; }
        
        /* HIDE DEFAULT BLOCKS */
        .gjs-block[title="Form"], .gjs-block[title="Input"], .gjs-block[title="Textarea"], .gjs-block[title="Select"], .gjs-block[title="Button"], .gjs-block[title="Label"], .gjs-block[title="Checkbox"], .gjs-block[title="Radio"], .gjs-block[title="Text"], .gjs-block[title="Link"], .gjs-block[title="Image"], .gjs-block[title="Video"], .gjs-block[title="Map"] { display: none !important; }
    </style>
</head>

<body x-data="editorApp()">

    <div class="fixed bottom-5 left-5 z-[9999] flex flex-col gap-2 pointer-events-none">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border-l-4 bg-white min-w-[250px]" :class="n.type==='success'?'border-green-500':'border-red-500'">
                <i class="ph text-xl" :class="n.type==='success'?'ph-check-circle text-green-500':'ph-warning-circle text-red-500'"></i>
                <div><h4 class="text-xs font-bold text-gray-800" x-text="n.title"></h4><p class="text-[10px] text-gray-500" x-text="n.msg"></p></div>
            </div>
        </template>
    </div>

    <header>
        <div class="flex items-center gap-4">
            <a href="/admin/pages" class="text-gray-400 hover:text-indigo-600 transition p-1.5 rounded hover:bg-gray-50"><i class="ph ph-arrow-left text-xl"></i></a>
            <div class="h-6 w-px bg-gray-200"></div>
            <div>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Page Slug</span>
                <input x-model="page.slug" class="bg-transparent font-mono font-bold text-sm text-gray-700 outline-none w-48 placeholder-gray-300 focus:text-indigo-600 transition" placeholder="nama-halaman">
            </div>
        </div>
        
        <div class="flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
            <button @click="setDevice('desktop')" :class="device=='desktop'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-desktop text-lg"></i></button>
            <button @click="setDevice('tablet')" :class="device=='tablet'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-tablet text-lg"></i></button>
            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>
            <div class="w-px h-5 bg-gray-300 mx-2"></div>
            <button @click="cmd('core:preview')" class="text-gray-500 hover:text-indigo-600 p-1.5" title="Preview"><i class="ph ph-eye text-lg"></i></button>
            <button @click="cmd('core:undo')" class="text-gray-400 hover:text-gray-700 p-1.5" title="Undo"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
            <button @click="cmd('core:redo')" class="text-gray-400 hover:text-gray-700 p-1.5" title="Redo"><i class="ph ph-arrow-u-up-right text-lg"></i></button>
        </div>

        <div class="flex items-center gap-3">
            <button @click="showSettings=true" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-gray-200 transition"><i class="ph ph-gear-six text-lg"></i> Config</button>
            <button @click="savePage" :disabled="loading" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-indigo-500/30">
                <i x-show="loading" class="ph ph-spinner animate-spin"></i><span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span>
            </button>
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
                    class="md:hidden bg-white text-gray-700 p-2 rounded-lg border border-gray-300 shadow-sm active:bg-gray-100">
                <i class="ph" :class="mobileMenuOpen ? 'ph-x' : 'ph-list'" style="font-size: 20px;"></i>
            </button>
        </div>
    </header>

    <div class="flex h-full w-full">
        <div id="gjs" class="w-full h-full"></div>
        <div class="flex h-full w-full relative"> <div id="gjs" class="w-full h-full"></div>

            <div class="mobile-overlay md:hidden" 
             :class="mobileMenuOpen ? 'show' : ''" 
             @click="mobileMenuOpen = false"></div>
        
                <div class="sidebar-desktop" :class="mobileMenuOpen ? 'is-open' : ''">
             </div>

            </div>
            <div class="panel-tabs flex border-bottom border-gray-200 bg-white">
                <button @click="tab='blocks'" :class="tab=='blocks'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Blocks"><i class="ph ph-squares-four text-xl"></i></button>
                <button @click="tab='styles'" :class="tab=='styles'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Styles"><i class="ph ph-paint-brush text-xl"></i></button>
                <button @click="tab='traits'" :class="tab=='traits'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Settings"><i class="ph ph-sliders text-xl"></i></button>
                <button @click="tab='layers'" :class="tab=='layers'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Layers"><i class="ph ph-stack text-xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto bg-white relative custom-scroll">
                <div x-show="tab=='blocks'" id="blocks-container" class="absolute inset-0 pb-20"></div>
                <div x-show="tab=='styles'"><div id="selectors-container" class="p-3 border-b bg-gray-50"></div><div id="styles-container" class="pb-20"></div></div>
                <div x-show="tab=='traits'"><div class="p-3 bg-gray-50 text-gray-500 text-[10px] font-bold uppercase tracking-widest border-b">Element Config</div><div id="traits-container" class="p-2 pb-20"></div></div>
                <div x-show="tab=='layers'" id="layers-container" class="absolute inset-0 pb-20"></div>
            </div>
        </div>
    </div>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[200] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="w-[450px] h-full bg-white shadow-2xl flex flex-col border-l border-gray-200" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="ph ph-faders text-indigo-600 text-xl"></i> Page Settings</h2>
                <button @click="showSettings = false" class="text-gray-400 hover:text-red-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll bg-white">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Product Type</h3>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button @click="page.product_type='physical'" :class="page.product_type=='physical'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Physical</button>
                        <button @click="page.product_type='digital'" :class="page.product_type=='digital'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Digital</button>
                        <button @click="page.product_type='donation'" :class="page.product_type=='donation'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Donation</button>
                    </div>
                    <div x-show="page.product_type==='physical'" class="mt-3 p-3 bg-blue-50 border border-blue-100 rounded-lg">
                        <label class="text-[10px] font-bold text-blue-800 uppercase">Shipping</label>
                        <div class="flex gap-2 mt-1">
                            <input x-model="page.config.shipping.weight" type="number" class="input-std" placeholder="Berat (gram)">
                            <label class="flex items-center gap-2 text-xs"><input type="checkbox" x-model="page.config.shipping.cod"> COD</label>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6" x-show="page.product_type !== 'donation'">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Harga & Varian</h3>
                    <div class="space-y-2">
                        <template x-for="(v, i) in page.config.variants">
                            <div class="flex gap-2 items-center">
                                <input x-model="v.name" class="input-std flex-1" placeholder="Nama Varian">
                                <input x-model="v.price" type="number" class="input-std w-24" placeholder="Rp">
                                <button @click="page.config.variants.splice(i,1)" class="text-red-500"><i class="ph ph-trash"></i></button>
                            </div>
                        </template>
                        <button @click="addVariant" class="w-full border-2 border-dashed border-gray-300 text-gray-500 font-bold text-xs py-2 rounded-lg hover:border-blue-400 hover:text-blue-500 transition">+ Tambah Varian</button>
                    </div>
                    <div x-show="page.config.variants.length === 0" class="mt-4">
                        <label class="text-[11px] font-bold text-gray-500">Harga Produk (Single)</label>
                        <input x-model="page.config.price" type="number" class="input-std mt-1" placeholder="0">
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <h3 class="text-xs font-bold text-purple-600 uppercase tracking-wider mb-3 flex items-center gap-2"><i class="ph ph-lightning"></i> Order Bump</h3>
                    <div class="flex gap-2 items-center mb-2"><input type="checkbox" x-model="page.config.order_bump.active"> Aktifkan</div>
                    <div x-show="page.config.order_bump.active" class="space-y-2">
                        <input x-model="page.config.order_bump.title" class="input-std" placeholder="Judul">
                        <input x-model="page.config.order_bump.price" type="number" class="input-std" placeholder="Harga">
                        <textarea x-model="page.config.order_bump.desc" class="input-std" rows="2" placeholder="Deskripsi"></textarea>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <h3 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-3">Payment</h3>
                    <select x-model="page.slug_payment" class="input-std bg-white">
                        <option value="whatsapp">WhatsApp Manual</option>
                        <template x-for="p in paymentProviders" :key="p.slug"><option :value="p.slug" x-text="p.name"></option></template>
                    </select>
                </div>
            </div>
            
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2">
                <button @click="showSettings=false" class="px-4 py-2 text-xs font-bold text-gray-500 hover:text-gray-700">CLOSE</button>
                <button @click="savePage(); showSettings=false" class="px-6 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700 shadow-md">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <div id="iconify-picker-modal" class="fixed inset-0 hidden z-[99999] bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">
      <div class="bg-white rounded-xl w-full max-w-xl shadow-2xl overflow-hidden mt-10">
        <div class="flex items-center justify-between p-4 border-b bg-gray-50"><input id="iconify-picker-search" placeholder="Search icon..." class="w-full bg-transparent outline-none text-sm" /><button id="iconify-picker-close"><i class="ph ph-x text-lg"></i></button></div>
        <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto"></div>
      </div>
    </div>

<script>
// --- ICON PICKER LOGIC ---
(function(){
    let activeModel = null; const modal = document.getElementById('iconify-picker-modal'); const input = document.getElementById('iconify-picker-search'); const results = document.getElementById('iconify-picker-results');
    window.openIconifyPicker = function(model) { activeModel = model; modal.classList.remove('hidden'); input.value = ''; input.focus(); searchIcons('star'); };
    document.getElementById('iconify-picker-close').onclick = () => modal.classList.add('hidden'); input.oninput = (e) => searchIcons(e.target.value);
    async function searchIcons(q) { if(!q) return; const res = await fetch(`https://api.iconify.design/search?query=${q}&limit=18`); const data = await res.json(); results.innerHTML = ''; if(data.icons) { data.icons.forEach(icon => { const btn = document.createElement('button'); btn.className = 'p-2 hover:bg-indigo-50 rounded flex flex-col items-center gap-1'; btn.innerHTML = `<iconify-icon icon="${icon}" width="24"></iconify-icon><span class="text-[9px] text-gray-400 truncate w-full text-center">${icon.split(':')[1]}</span>`; btn.onclick = () => { if(activeModel) activeModel.setAttributes({ icon: icon }); modal.classList.add('hidden'); }; results.appendChild(btn); }); } }
})();

// --- APP LOGIC ---
function editorApp() {
    return {
        mobileMenuOpen: false,
        loading: false, showSettings: false, device: 'desktop', tab: 'blocks', notifications: [], paymentProviders: [],
        page: { 
            slug: '', title: '', product_type: 'physical', slug_payment: 'whatsapp', id: 0,
            config: { price: 0, variants: [], shipping: { weight: 1000, cod: false }, order_bump: { active: false }, coupons: [], settings: {}, active_payments: [] } 
        },

        async init() {
            const params = new URLSearchParams(window.location.search); this.page.slug = params.get('slug') || 'new-page';
            await this.fetchPaymentProviders();
            this.initGrapes();
        },

        async fetchPaymentProviders() {
            try { const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' }); if (res.status === 401) return; const json = await res.json(); this.paymentProviders = Array.isArray(json) ? json : (json.results || []); } catch (e) {}
        },

        addVariant() { this.page.config.variants.push({ id: Date.now(), name: '', price: 0 }); },

        async savePage() {
            this.loading = true;
            try {
                let html = window.editor.getHtml();
                html = html.replace('name="page_id" value="0"', `name="page_id" value="${this.page.id||0}"`);
                
                const res = await fetch('/api/admin/pages', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: this.page.slug, title: this.page.title, product_type: this.page.product_type, provider: this.page.slug_payment, html: html, css: window.editor.getCss(), product_config: this.page.config }) });
                if (res.status === 401) { window.location.href = '/login'; return; }
                this.notify(res.ok ? 'Sukses' : 'Error', res.ok ? 'Berhasil disimpan!' : 'Gagal menyimpan', res.ok ? 'success' : 'error');
            } catch (e) { this.notify('Error', 'Koneksi bermasalah', 'error'); }
            this.loading = false;
        },

        notify(title, msg, type = 'success') { const id = Date.now(); this.notifications.push({ id, title, msg, type, show: true }); setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== id); }, 3000); },
        setDevice(d) { this.device = d; window.editor.setDevice(d); },
        cmd(c) { window.editor.runCommand(c); },

        initGrapes() {
            // === 1. BRIDGE CSS (CRITICAL: TAMPILAN SAMA PERSIS DENGAN PREVIEW) ===
            const bridgeCSS = `
                /* CANVAS RESET */
                body { min-height: 100vh; background-color: #ffffff; overflow-x: hidden; }
                
                /* THUMBNAIL GALLERY (HORIZONTAL) */
                .product-gallery { display: flex; flex-direction: column; gap: 12px; width:100%; }
                .product-gallery .main-img { border-radius: 12px; overflow: hidden; width: 100%; aspect-ratio: 4/3; background: #f3f4f6; }
                .product-gallery .main-img img { width: 100%; height: 100%; object-fit: cover; }
                .product-gallery .thumbs { display: flex; flex-direction: row; gap: 10px; overflow-x: auto; padding-bottom: 5px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
                .product-gallery .thumb { min-width: 70px; width: 70px; height: 70px; flex-shrink: 0; border-radius: 8px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: 0.2s; object-fit: cover; }
                .product-gallery .thumb.active, .product-gallery .thumb:hover { border-color: #2563eb; opacity: 1; }

                /* CAROUSEL SLIDER (AUTO PLAY) */
                .editable-carousel { position: relative; width: 100%; overflow: hidden; border-radius: 0; }
                .editable-carousel .slides { display: flex; flex-direction: row; width: 100%; height: 100%; transition: transform 0.5s ease; }
                .editable-carousel .slide { min-width: 100%; flex-shrink: 0; position: relative; height: 100%; }
                .editable-carousel .slide img { width: 100%; height: 100%; object-fit: cover; }
                .editable-carousel .carousel-controls { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
                .editable-carousel .carousel-controls button { pointer-events: auto; background: rgba(0,0,0,0.3); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
                .editable-carousel .carousel-controls button:hover { background: rgba(0,0,0,0.6); }

                /* PRICING & TESTIMONIAL */
                .pricing-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; height: 100%; transition: 0.3s; }
                .pricing-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
                .pricing-card.highlight { border: 2px solid #2563eb; position: relative; }
                .pricing-card .title { font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:0.6px; color:#475569; }
                .pricing-card .price { font-size:32px; font-weight:900; color:#0f172a; margin:10px 0; }
