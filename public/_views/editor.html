<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingBuilder - Ultimate Professional Edition</title>
    
    <script>
        (function() {
            const originalWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
                originalWarn.apply(console, args);
            };
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script> 
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-component-countdown@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tabs@1.0.6"></script>
    <script src="https://unpkg.com/grapesjs-custom-code@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-tooltip@0.1.7"></script>
    <script src="https://unpkg.com/grapesjs-blocks-flexbox@0.1.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-export@1.0.11"></script>
    <script src="https://unpkg.com/grapesjs-typed@1.0.5"></script>
    <script src="https://unpkg.com/grapesjs-style-bg@2.0.1"></script>

    <style>
        /* --- UI EDITOR STYLING (INTERFACE) --- */
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; color: #1e293b; }
        [x-cloak] { display: none !important; }
        
        /* GrapesJS Overrides */
        .gjs-pn-top-panel, .gjs-pn-views-container, .gjs-pn-views { display: none !important; }
        
        .gjs-cv-canvas { 
            width: calc(100% - 320px) !important; 
            height: calc(100% - 60px) !important; 
            top: 60px !important; 
            left: 0 !important;
            background-color: #f3f4f6; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .gjs-selected { outline: 2px solid #6366f1 !important; outline-offset: -2px; }
        .gjs-color-picker { z-index: 99999 !important; }
        
        /* Sidebar Styling */
        .sidebar-desktop {
            position: fixed; top: 60px; right: 0; bottom: 0; width: 320px;
            background: white; border-left: 1px solid #e5e7eb;
            display: flex; flex-direction: column; z-index: 100;
        }

        /* Mobile/Tablet responsive handling: will be controlled by Alpine state (no CSS display override here) */
        @media (max-width: 1023px) {
            .gjs-cv-canvas { width: 100% !important; }
        }

        /* Block Grid (Compact) */
        .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
        .gjs-block { 
            width: 100% !important; min-height: auto !important; padding: 12px 8px !important; 
            background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; 
            display: flex; flex-direction: column; align-items: center; gap: 6px; 
            cursor: grab; transition: all 0.2s; box-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        .gjs-block:hover { border-color: #6366f1; color: #6366f1; transform: translateY(-2px); box-shadow: 0 4px 10px -1px rgba(99, 102, 241, 0.2); }
        .gjs-block-label { font-size: 10px; font-weight: 600; text-align: center; color: #4b5563; margin-top: 4px; }
        .gjs-block-category .gjs-title { background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 8px 12px; font-size: 10px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; } 
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Inputs & Tabs */
        .panel-tabs button.active { color: #6366f1; border-bottom: 2px solid #6366f1; background: #eef2ff; }
        .input-std { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; transition: 0.2s; }
        .input-std:focus { border-color: #6366f1; ring: 2px solid #e0e7ff; }
        
        /* HIDE DEFAULT UGLY BLOCKS */
        .gjs-block[title="Form"], .gjs-block[title="Input"], .gjs-block[title="Textarea"], .gjs-block[title="Select"], .gjs-block[title="Button"], .gjs-block[title="Label"], .gjs-block[title="Checkbox"], .gjs-block[title="Radio"], .gjs-block[title="Text"], .gjs-block[title="Link"], .gjs-block[title="Image"], .gjs-block[title="Video"], .gjs-block[title="Map"] { display: none !important; }

        /* Header tweaks: move right controls down by 1px to align with top border (permits small visual nudge) */
        .header-right-controls { transform: translateY(1px); }

        /* Enhanced pricing styles injected into canvas as bridge CSS too (kept there). These are fallback UI styles for editor controls if needed. */
        .editor-pricing-preview {
            display:flex; gap:16px; align-items:stretch; justify-content:center;
            flex-wrap:wrap;
        }
        .editor-pricing-card {
            background: linear-gradient(180deg,#fff,#fbfdff);
            border: 1px solid rgba(15,23,42,0.06);
            border-radius: 16px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 8px 30px rgba(2,6,23,0.06);
            display:flex; flex-direction:column;
        }
        .editor-pricing-card .price { font-size:28px; font-weight:900; color:#0f172a; margin:8px 0; }
        .editor-pricing-card .badge { font-size:11px; padding:6px 10px; border-radius:999px; background:#f0f9ff; color:#0369a1; font-weight:700; display:inline-block; margin-bottom:8px; }
        .editor-pricing-card ul { list-style:none; padding:0; margin:8px 0 0 0; flex-grow:1; }
        .editor-pricing-card ul li { margin:8px 0; color:#475569; display:flex; gap:8px; align-items:center; }

        /* small transitions for sidebar toggle */
        .sidebar-slide-enter { transform: translateX(100%); }
        .sidebar-slide-enter-active { transform: translateX(0); transition: transform 200ms ease; }
        .sidebar-slide-leave { transform: translateX(0); }
        .sidebar-slide-leave-active { transform: translateX(100%); transition: transform 200ms ease; }
    </style>
</head>

<body x-data="editorApp()" x-init="init()" class="antialiased">

    <!-- Notifications (single copy) -->
    <div class="fixed bottom-5 left-5 z-[9999] flex flex-col gap-2 pointer-events-none">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border-l-4 bg-white min-w-[250px]" :class="n.type==='success'?'border-green-500':'border-red-500'">
                <i class="ph text-xl" :class="n.type==='success'?'ph-check-circle text-green-500':'ph-warning-circle text-red-500'"></i>
                <div><h4 class="text-xs font-bold text-gray-800" x-text="n.title"></h4><p class="text-[10px] text-gray-500" x-text="n.msg"></p></div>
            </div>
        </template>
    </div>

    <!-- Iconify Picker Modal (single copy) -->
    <div id="iconify-picker-modal" class="fixed inset-0 hidden z-[99999] bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">
      <div class="bg-white rounded-xl w-full max-w-xl shadow-2xl overflow-hidden mt-10">
        <div class="flex items-center justify-between p-4 border-b bg-gray-50">
          <input id="iconify-picker-search" placeholder="Search icon (e.g. check, user)..." class="w-full bg-transparent outline-none text-sm" />
          <button id="iconify-picker-close"><i class="ph ph-x text-lg"></i></button>
        </div>
        <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto"></div>
      </div>
    </div>

    <!-- HEADER (single bar only) -->
    <header class="h-[60px] bg-white border-b border-gray-200 flex justify-between items-center px-4 z-50 relative shrink-0">
        <div class="flex items-center gap-4">
            <a href="/admin/pages" class="text-gray-400 hover:text-indigo-600 transition p-1.5 rounded hover:bg-gray-50"><i class="ph ph-arrow-left text-xl"></i></a>

            <!-- Toggle Sidebar (visible on tablet & mobile only, hidden on larger desktops/windows) -->
            <button @click="toggleSidebar()" class="lg:hidden text-gray-500 hover:text-indigo-600 p-1.5 rounded transition" title="Toggle Editor Menu">
                <i class="ph ph-list text-lg"></i>
            </button>

            <div class="h-6 w-px bg-gray-200"></div>
            <div>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Page Slug</span>
                <input x-model="page.slug" class="bg-transparent font-mono font-bold text-sm text-gray-700 outline-none w-48 placeholder-gray-300 focus:text-indigo-600 transition" placeholder="nama-halaman">
            </div>
        </div>
        
        <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
            <button @click="setDevice('desktop')" :class="device=='desktop'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-desktop text-lg"></i></button>
            <button @click="setDevice('tablet')" :class="device=='tablet'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-tablet text-lg"></i></button>
            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>
            <div class="w-px h-5 bg-gray-300 mx-2"></div>
            <button @click="cmd('core:preview')" class="text-gray-600 hover:text-indigo-600 p-1.5" title="Preview"><i class="ph ph-eye text-lg"></i></button>
            <button @click="cmd('core:undo')" class="text-gray-400 hover:text-gray-700 p-1.5" title="Undo"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
            <button @click="cmd('core:redo')" class="text-gray-400 hover:text-gray-700 p-1.5" title="Redo"><i class="ph ph-arrow-u-up-right text-lg"></i></button>
        </div>

        <div class="flex items-center gap-3 header-right-controls">
            <button @click="showSettings=true" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-gray-200 transition">
                <i class="ph ph-gear-six text-lg"></i> Config
            </button>
            <button @click="savePage" :disabled="loading" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-indigo-500/30">
                <i x-show="loading" class="ph ph-spinner animate-spin"></i>
                <span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span>
            </button>
        </div>
    </header>

    <div class="flex h-[calc(100vh-60px)] overflow-hidden relative">
        <div class="flex-1 relative bg-[#f3f4f6] overflow-hidden">
            <div id="gjs" class="w-full h-full"></div>
        </div>
        
        <!-- Sidebar: visibility controlled by Alpine (visible always on desktop, toggleable on tablet/mobile) -->
        <div x-show="sidebarVisible || isDesktop" x-cloak x-transition:enter="sidebar-slide-enter-active" x-transition:leave="sidebar-slide-leave-active" class="sidebar-desktop">
            <div class="panel-tabs flex border-bottom border-gray-200 bg-white">
                <button @click="tab='blocks'" :class="tab=='blocks'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Blocks"><i class="ph ph-squares-four text-xl"></i></button>
                <button @click="tab='styles'" :class="tab=='styles'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Styles"><i class="ph ph-paint-brush text-xl"></i></button>
                <button @click="tab='traits'" :class="tab=='traits'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Settings"><i class="ph ph-sliders text-xl"></i></button>
                <button @click="tab='layers'" :class="tab=='layers'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition" title="Layers"><i class="ph ph-stack text-xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto bg-white relative custom-scroll">
                <div x-show="tab=='blocks'" id="blocks-container" class="absolute inset-0 pb-20"></div>
                <div x-show="tab=='styles'">
                    <div id="selectors-container" class="p-3 border-b bg-gray-50"></div>
                    <div id="styles-container" class="pb-20"></div>
                </div>
                <div x-show="tab=='traits'">
                    <div class="p-3 bg-gray-50 text-gray-500 text-[10px] font-bold uppercase tracking-widest border-b">Element Config</div>
                    <div id="traits-container" class="p-2 pb-20"></div>
                </div>
                <div x-show="tab=='layers'" id="layers-container" class="absolute inset-0 pb-20"></div>
            </div>
        </div>
    </div>

    <!-- Settings Drawer -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[200] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="w-[450px] h-full bg-white shadow-2xl flex flex-col border-l border-gray-200" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="ph ph-faders text-indigo-600 text-xl"></i> Page Settings</h2>
                <button @click="showSettings = false" class="text-gray-400 hover:text-red-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll bg-white">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Product Type</h3>
                    <div class="flex bg-gray-100 p-1 rounded-lg mb-4">
                        <button @click="page.product_type='physical'" :class="page.product_type=='physical'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Physical</button>
                        <button @click="page.product_type='digital'" :class="page.product_type=='digital'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Digital</button>
                        <button @click="page.product_type='donation'" :class="page.product_type=='donation'?'bg-white shadow text-indigo-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded">Donation</button>
                    </div>
                    <div x-show="page.product_type==='physical'" class="space-y-3 bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <div><label class="text-[11px] font-bold text-gray-600">Berat (gram)</label><input x-model="page.config.shipping.weight" type="number" class="input-std mt-1" placeholder="1000"></div>
                        <div class="flex items-center gap-2"><input type="checkbox" id="cod" x-model="page.config.shipping.cod" class="w-4 h-4 text-blue-600 rounded"><label for="cod" class="text-xs font-medium text-gray-700">Aktifkan COD</label></div>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6" x-show="page.product_type !== 'donation'">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex gap-2 items-center"><i class="ph ph-tag"></i> Harga & Varian</h3>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(v, i) in page.config.variants">
                            <div class="flex gap-2 items-center">
                                <input x-model="v.name" class="input-std flex-1" placeholder="Nama Varian (mis: Merah)">
                                <input x-model="v.price" type="number" class="input-std w-24" placeholder="Rp">
                                <button @click="page.config.variants.splice(i,1)" class="text-red-500 hover:text-red-700"><i class="ph ph-trash text-lg"></i></button>
                            </div>
                        </template>

                    </div>
                    <div x-show="page.config.variants.length === 0" class="mt-4 p-4 bg-gray-50 rounded border">
                        <label class="text-[11px] font-bold text-gray-500">Harga Produk (Single)</label>
                        <input x-model="page.config.price" type="number" class="input-std mt-1 font-bold text-gray-800" placeholder="0">
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-purple-600 uppercase tracking-wider flex gap-2 items-center"><i class="ph ph-lightning"></i> Order Bump</h3>
                        <input type="checkbox" x-model="page.config.order_bump.active" class="w-4 h-4 text-purple-600 rounded">

                    <div x-show="page.config.order_bump.active" class="space-y-3 bg-purple-50 p-4 rounded-lg border border-purple-100">
                        <input x-model="page.config.order_bump.title" class="input-std" placeholder="Judul Penawaran">
                        <input x-model="page.config.order_bump.price" type="number" class="input-std" placeholder="Harga Tambahan">
                        <textarea x-model="page.config.order_bump.desc" class="input-std" rows="2" placeholder="Deskripsi singkat..."></textarea>
                    </div>
                </div>

                    <div class="space-y-2">
                        <template x-for="(c, i) in page.config.coupons">

                                <input x-model="c.code" class="input-std uppercase font-mono font-bold text-red-600 flex-1" placeholder="KODE">
                                <select x-model="c.type" class="input-std w-24"><option value="percent">%</option><option value="flat">Rp</option></select>
                                <input x-model="c.value" type="number" class="input-std w-20">

                            </div>

                        <button @click="page.config.coupons.push({code:'', type:'percent', value:0})" class="w-full border border-red-200 text-red-500 text-xs font-bold py-2 rounded hover:bg-red-50">+ Tambah Kupon</button>

                    <label class="text-[10px] font-bold text-gray-500">Provider Default</label>
                    <select x-model="page.slug_payment" class="input-std mt-1 mb-4 bg-white">
                        <option value="whatsapp">WhatsApp Manual</option>
                        <template x-for="p in paymentProviders" :key="p.slug"><option :value="p.slug" x-text="p.name"></option></template>
                    </select>
                    <div class="space-y-1 bg-gray-50 p-3 rounded border border-gray-200 h-32 overflow-y-auto custom-scroll">
                        <template x-for="p in paymentProviders" :key="p.slug">
                            <label class="flex items-center gap-2 p-1 hover:bg-white rounded cursor-pointer">
                                <input type="checkbox" :value="p.slug" x-model="page.config.active_payments" class="w-4 h-4 text-blue-600 rounded">
                                <span class="text-xs text-gray-700" x-text="p.name"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6 space-y-3">
                    <h3 class="text-xs font-bold text-green-600 uppercase tracking-wider flex gap-2 items-center"><i class="ph ph-globe"></i> SEO & Tracking</h3>
                    <div><label class="text-[10px] font-bold text-gray-500">Meta Title</label><input x-model="page.config.settings.seo_title" class="input-std"></div>
                    <div><label class="text-[10px] font-bold text-gray-500">Meta Desc</label><textarea x-model="page.config.settings.seo_description" class="input-std" rows="2"></textarea></div>
                    <div><label class="text-[10px] font-bold text-gray-500">Facebook Pixel ID</label><input x-model="page.config.settings.fb_pixel_id" class="input-std"></div>
                </div>
            </div>
            
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2">
                <button @click="showSettings=false" class="px-4 py-2 text-xs font-bold text-gray-500 hover:text-gray-700">TUTUP</button>
                <button @click="savePage(); showSettings=false" class="px-6 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700 shadow-md">SIMPAN SEMUA</button>
            </div>
        </div>
    </div>

    <script>
    // --- ICON PICKER LOGIC (Helper untuk Iconify) ---
    (function(){
        let activeModel = null;
        const modal = document.getElementById('iconify-picker-modal');
        const input = document.getElementById('iconify-picker-search');
        const results = document.getElementById('iconify-picker-results');
        const closeBtn = document.getElementById('iconify-picker-close');
        
        // Fungsi untuk membuka modal
        window.openIconifyPicker = function(model) {
            activeModel = model;
            if(modal) modal.classList.remove('hidden');
            if(input) { input.value = ''; input.focus(); }
            searchIcons('star'); // Default search agar tidak kosong
        };
        
        if(closeBtn) closeBtn.onclick = () => modal.classList.add('hidden');
        if(input) input.oninput = (e) => searchIcons(e.target.value);
        
        // Logic pencarian ke API Iconify
        async function searchIcons(q) {
            if(!q) return;
            try {
                const res = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(q)}&limit=24`);
                const data = await res.json();
                if(results) {
                    results.innerHTML = '';
                    if(data.icons) {
                        data.icons.forEach(icon => {
                            const btn = document.createElement('button');
                            btn.className = 'p-2 hover:bg-indigo-50 rounded flex flex-col items-center gap-1 border border-transparent hover:border-indigo-100 transition';
                            btn.innerHTML = `<iconify-icon icon="${icon}" width="24" style="color:#1e293b;"></iconify-icon><span class="text-[9px] text-gray-400 truncate w-full text-center">${icon.split(':')[1]}</span>`;
                            btn.onclick = () => {
                                if(activeModel) {
                                    // Update attribute di GrapesJS component
                                    activeModel.setAttributes({ icon: icon });
                                }
                                modal.classList.add('hidden');
                            };
                            results.appendChild(btn);
                        });
                    }
                }
            } catch(e) { console.error("Icon search failed", e); }
        }
    })();

    // --- MAIN EDITOR LOGIC (Alpine.js Controller) ---
    function editorApp() {
        return {
            // State Variables
            loading: false,

            // Fetch Payment Providers dari Backend
            async fetchPaymentProviders() {
                try {
                    const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' });
                    if (res.status === 401) { return; } // Handle auth error silently or redirect
                    const json = await res.json();
                    
                    // Normalisasi response array
                    if (Array.isArray(json)) this.paymentProviders = json;
                    else if (json.data && Array.isArray(json.data)) this.paymentProviders = json.data;
                    else if (json.results && Array.isArray(json.results)) this.paymentProviders = json.results;
                    else this.paymentProviders = [];
                } catch (e) {
                    console.warn('Gagal fetch payment providers, menggunakan mode offline/demo');

            // Logic Penyimpanan Halaman ke API
            async savePage() {
                this.loading = true;
                try {
                    let html = window.editor.getHtml();
                    const css = window.editor.getCss();
                    
                    // PENTING: Inject Page ID ke dalam Form Contact
                    // Ini mengganti value="0" default dengan ID halaman yang benar
                    html = html.replace(/name="page_id" value="0"/g, `name="page_id" value="${this.page.id||0}"`);
                    
                    const payload = {
                        slug: this.page.slug,
                        title: this.page.title || this.page.slug,
                        product_type: this.page.product_type,
                        provider: this.page.slug_payment,
                        html: html,
                        css: css,
                        product_config: this.page.config
                    };

                    const res = await fetch('/api/admin/pages', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.status === 401) { window.location.href = '/login'; return; }
                    
                    if (res.ok) {
                        this.notify('Sukses', 'Halaman berhasil disimpan!', 'success');
                    } else {
                        const data = await res.json();
                        this.notify('Gagal', data.message || 'Gagal menyimpan', 'error');
                    }
                } catch (e) {
                    this.notify('Error', 'Gagal terhubung ke server', 'error');
                    console.error(e);
                }
                this.loading = false;
            },
