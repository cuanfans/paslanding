    <style>

        width: calc(100% - 320px) !important;

<body x-data="editorApp()">

            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-indigo-600':'text-gray-400'" class="p-1.5 rounded transition"><i class="ph ph-device-mobile text-lg"></i></button>

            <button @click="cmd('core:undo')" class="text-gray-400 hover:text-gray-700 p-1.5"><i class="ph ph-arrow-u-up-left text-lg"></i></button>
            <button @click="cmd('core:redo')" class="text-gray-400 hover:text-gray-700 p-1.5"><i class="ph ph-arrow-u-up-right text-lg"></i></button>

    <!-- Main -->

        <div class="flex-1 relative bg-[#f3f4f6] overflow-hidden">
            <div id="gjs" class="w-full h-full"></div>
        </div>

        <div class="sidebar-desktop">
            <div class="panel-tabs flex border-bottom border-gray-200 bg-white">
                <button @click="tab='blocks'" :class="tab=='blocks'?'active':''" class="flex-1 p-3 text-gray-400 hover:bg-gray-50 transition"><i class="ph ph-squares-four text-xl"></i></button>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[200] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="w-[450px] h-full bg-white shadow-2xl flex flex-col border-l border-gray-200" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">

            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll bg-white">
                <!-- Settings content reused from previous file (kept intact) -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Tipe Produk</h3>
                    <div class="flex bg-gray-100 p-1 rounded-lg mb-4">

    <!-- Iconify picker (overlay) -->
    <div id="iconify-picker-modal" class="fixed inset-0 hidden z-[99999] bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">

        <div class="flex items-center justify-between p-4 border-b bg-gray-50">
          <input id="iconify-picker-search" placeholder="Search icon..." class="w-full bg-transparent outline-none text-sm" />
          <button id="iconify-picker-close"><i class="ph ph-x text-lg"></i></button>

        <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto"></div>
      </div>

<script>
/* ------------------------------
   ICONIFY PICKER (restored & improved)
   - supports selecting icons and attaches to iconify-icon model
   ------------------------------ */
(function(){
    let activeModel = null;
    const modal = document.getElementById('iconify-picker-modal');
    const input = document.getElementById('iconify-picker-search');
    const results = document.getElementById('iconify-picker-results');

    window.openIconifyPicker = function(model){
        activeModel = model;
        modal.classList.remove('hidden');
        input.value = '';
        results.innerHTML = '<div class="col-span-full text-center text-gray-400 text-xs py-6">Loading...</div>';
        searchIcons('star');
        input.focus();
    };

    document.getElementById('iconify-picker-close').onclick = () => modal.classList.add('hidden');
    input.addEventListener('input', (e)=> {
        if(e.target.value.trim().length === 0) { results.innerHTML = ''; return; }
        searchIcons(e.target.value.trim());
    });

    async function searchIcons(q){
        if(!q) return;
        try {
            const res = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(q)}&limit=24`);
            const j = await res.json();
            results.innerHTML = '';
            if (Array.isArray(j.icons) && j.icons.length) {
                j.icons.forEach(icon => {
                    const btn = document.createElement('button');
                    btn.className = 'p-2 hover:bg-indigo-50 rounded flex flex-col items-center gap-1';
                    btn.innerHTML = `<iconify-icon icon="${icon}" width="28"></iconify-icon><span class="text-[9px] text-gray-400 truncate w-full text-center">${icon.split(':')[1]||icon}</span>`;
                    btn.onclick = () => {
                        if(activeModel && activeModel.setAttributes) activeModel.setAttributes({ icon: icon });
                        modal.classList.add('hidden');
                    };
                    results.appendChild(btn);
                });
            } else {
                results.innerHTML = '<div class="col-span-full text-center text-gray-400 text-xs py-6">No icons</div>';
            }
        } catch (e) {
            results.innerHTML = '<div class="col-span-full text-center text-gray-400 text-xs py-6">Error fetching icons</div>';
        }
    }
})();

/* ------------------------------
   MAIN EDITOR APP
   - restores missing blocks & logic to the new editor version
   ------------------------------ */
function editorApp(){
    return {
        loading: false,
        showSettings: false,
        device: 'desktop',
        tab: 'blocks',
        notifications: [],
        paymentProviders: [],
        page: {
            slug: '',
            title: '',
            product_type: 'physical',
            slug_payment: 'whatsapp',
            config: {
                price: 0,
                variants: [],
                shipping: { weight: 1000, cod: false },
                order_bump: { active:false, title:'', price:0, desc:'' },
                coupons: [],
                settings: {},
                active_payments: []
            }
        },

        async init(){
            const params = new URLSearchParams(window.location.search);
            this.page.slug = params.get('slug');
            await this.fetchPaymentProviders();
            this.initGrapes();
        },

        async fetchPaymentProviders(){
            try {
                const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' });
                if(res.status === 401) return;
                const j = await res.json();
                if(Array.isArray(j)) this.paymentProviders = j;
                else if(Array.isArray(j.data)) this.paymentProviders = j.data;
                else if(Array.isArray(j.results)) this.paymentProviders = j.results;
                else this.paymentProviders = j || [];
            } catch(e) { console.warn('fetchPaymentProviders', e); }
        },

        addVariant(){ this.page.config.variants.push({ id: Date.now(), name:'', price:0 }); },

        notify(title, msg, type='success'){
            const id = Date.now();
            this.notifications.push({ id, title, msg, type, show: true });
            setTimeout(()=>{ const i = this.notifications.findIndex(n=>n.id===id); if(i>-1) this.notifications.splice(i,1); }, 3000);
        },

        async savePage(){
            this.loading = true;
            try {
                const rawHtml = window.editor.getHtml();
                const rawCss  = window.editor.getCss();

                const res = await fetch('/api/admin/pages', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slug: this.page.slug,
                        title: this.page.title,
                        product_type: this.page.product_type,
                        provider: this.page.slug_payment,
                        html: rawHtml,
                        css: rawCss,
                        product_config: this.page.config
                    })
                });
                if(res.status === 401){ window.location.href = '/login'; return; }
                if(res.ok) this.notify('Sukses', 'Halaman tersimpan!');
                else this.notify('Gagal', 'Tidak dapat menyimpan', 'error');
            } catch(e){
                this.notify('Error', 'Gagal simpan (network)', 'error');
            }
            this.loading = false;
        },

        setDevice(d){ this.device = d; if(window.editor) window.editor.setDevice(d); },
        cmd(c){ if(window.editor) window.editor.runCommand(c); },

        initGrapes(){
            /* Initialize grapesjs with tailwind in canvas; keep daisyui optional via CDN */
            window.editor = grapesjs.init({
                container: '#gjs',
                height: '100%',
                fromElement: false,
                storageManager: false,
                canvas: {
                    scripts: ['https://cdn.tailwindcss.com', 'https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js'],
                    styles: [
                        // keep minimal fonts / style; do not inline full tailwind
                        'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap'
                    ],
                    content: `
                        <script>
                          tailwind.config = {
                            theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] }, colors: { theme: { 500:'#6366f1' } } } }
                          }
                        <\/script>
                        <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}</style>
                    `
                },
                plugins: [
                    'gjs-blocks-basic', 'grapesjs-plugin-forms', 'grapesjs-navbar',
                    'grapesjs-component-countdown','grapesjs-tabs','grapesjs-custom-code',
                    'grapesjs-tooltip','grapesjs-blocks-flexbox','grapesjs-plugin-export',
                    'grapesjs-typed','grapesjs-style-bg'
                ],
                deviceManager: { devices: [{ id: 'desktop', width: '' }, { id: 'tablet', width: '768px' }, { id: 'mobile', width: '375px' }] },
                blockManager: { appendTo: '#blocks-container' },
                layerManager: { appendTo: '#layers-container' },
                selectorManager: { appendTo: '#selectors-container' },
                traitManager: { appendTo: '#traits-container' },
                styleManager: { appendTo: '#styles-container' }
            });

            // Inject minimal canvas CSS so pricing-grid, carousel, social-proof render inside iframe
            const canvasCss = `
                .pricing-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:16px}
                @media(min-width:768px){.pricing-grid{grid-template-columns:repeat(3,1fr)}}
                .pricing-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e6eef8;box-shadow:0 8px 24px rgba(14,42,71,0.06);display:flex;flex-direction:column;gap:12px}
                .editable-carousel{position:relative;overflow:hidden;border-radius:12px}
                .editable-carousel .slides{display:flex;transition:transform .5s ease}
                .editable-carousel .slide{min-width:100%;flex:0 0 100%;position:relative}
                .social-proof { position: fixed; bottom: 20px; left: 16px; z-index: 9999; display:none; }
            `;
            try { window.editor.setStyle(canvasCss); } catch(e){ console.warn('setStyle failed', e); }

            const domc = window.editor.DomComponents;
            const bm = window.editor.BlockManager;

            // Restore icon component (improved)
            domc.addType('iconify-icon', {
                model: {
                    defaults: {
                        tagName: 'iconify-icon',
                        droppable: false,
                        attributes: { icon: 'ph:star-fill', width: '28', class: 'text-yellow-400' },
                        traits: [
                            { type: 'button', text: '🔍 Change Icon', full: true, command: (ed, trait) => window.openIconifyPicker(trait.target) },
                            { name: 'width', type: 'number', label: 'Size' },
                            { name: 'class', label: 'Class' }
                        ]
                    }
                }
            });

            // Editable carousel type: script executed in canvas to wire behavior
            domc.addType('editable-carousel', {
                model: {
                    defaults: {
                        script: function() {
                            const wrap = this; const slidesWrap = wrap.querySelector('.slides'); const slides = Array.from(wrap.querySelectorAll('.slide'));
                            let idx = 0;
                            function show(i){ idx = (i + slides.length) % slides.length; slidesWrap.style.transform = 'translateX(' + (-idx * 100) + '%)'; updateDots(); }
                            function updateDots(){ const dots = wrap.querySelectorAll('.carousel-dots button'); dots.forEach((b,bi)=> b.style.background = bi===idx ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.6)'); }
                            const prev = wrap.querySelector('.prev'), next = wrap.querySelector('.next');
                            if(prev) prev.addEventListener('click', ()=> show(idx-1));
                            if(next) next.addEventListener('click', ()=> show(idx+1));
                            // build dots
                            const dotsWrap = wrap.querySelector('.carousel-dots');
                            if(dotsWrap){
                                dotsWrap.innerHTML = '';
                                slides.forEach((s,i)=>{ const b=document.createElement('button'); b.addEventListener('click',()=>show(i)); dotsWrap.appendChild(b); });
                            }
                            show(0);
                            const auto = wrap.dataset.auto === 'true'; const interval = parseInt(wrap.dataset.interval||5000,10);
                            if(auto){ let timer = setInterval(()=>show(idx+1), interval); wrap.addEventListener('mouseenter', ()=> clearInterval(timer)); wrap.addEventListener('mouseleave', ()=> timer = setInterval(()=>show(idx+1), interval)); }
                        }
                    }
                }
            });

            // Restore blocks that were missing: pricing variants, social-proof, checkout-pro, contact-pro (custom)
            // Pricing compact
            const pricingCompact = `
                <div class="pricing-grid" style="max-width:1100px;margin:0 auto;padding:24px">
                    <div class="pricing-card" data-gjs-editable="true">
                        <div class="title" contenteditable="true">Starter</div>
