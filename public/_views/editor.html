<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingBuilder - Pro Editor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.2/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.2/dist/grapes.min.js"></script>
    <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5"></script>
    <script src="https://unpkg.com/grapesjs-navbar@1.0.1"></script>
    <script src="https://unpkg.com/grapesjs-component-countdown@1.0.1"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* RESET & BASE */
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #fff; }
        [x-cloak] { display: none !important; }
        
        /* FIX CANVAS LAYOUT (Agar tidak tertutup Header) */
        .gjs-cv-canvas { 
            width: calc(100% - 320px) !important; 
            height: calc(100% - 60px) !important; 
            top: 60px !important; 
            left: 0 !important;
            background-color: #f1f5f9; 
        }

        /* UI Overrides */
        .gjs-pn-top-panel, .gjs-pn-views-container, .gjs-pn-views { display: none !important; }
        .gjs-selected { outline: 2px solid #2563eb !important; outline-offset: -2px; }
        .gjs-dashed * { outline: 1px dashed rgba(0,0,0,0.1); }
        
        /* Sidebar Panel */
        .sidebar-desktop {
            position: fixed; top: 56px; right: 0; bottom: 0; width: 320px;
            background: white; border-left: 1px solid #e2e8f0;
            display: flex; flex-direction: column; z-index: 100;
            box-shadow: -4px 0 15px rgba(0,0,0,0.02);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Block Manager Grid */
        .gjs-blocks-c { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
        .gjs-block { 
            width: 100% !important; min-height: auto !important; padding: 15px 5px !important; margin: 0 !important;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .gjs-block:hover { border-color: #3b82f6; color: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.15); }
        .gjs-block-label { font-size: 10px; font-weight: 600; text-align: center; color: #475569; }
        .gjs-block-category .gjs-title { background: #f8fafc; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 8px 12px; font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; }

        /* Icon Picker Modal */
        #iconify-picker-modal { z-index: 99999; }
        
        .input-std { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .input-std:focus { border-color: #2563eb; }
    </style>
</head>

<body x-data="editorApp()">

    <div class="fixed bottom-5 left-5 z-[9999] flex flex-col gap-2 pointer-events-none">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border-l-4 bg-white min-w-[250px]" :class="n.type==='success'?'border-green-500':'border-red-500'">
                <i class="ph text-xl" :class="n.type==='success'?'ph-check-circle text-green-500':'ph-warning-circle text-red-500'"></i>
                <div><h4 class="text-xs font-bold text-gray-800" x-text="n.title"></h4><p class="text-[10px] text-gray-500" x-text="n.msg"></p></div>
            </div>
        </template>
    </div>

    <div id="iconify-picker-modal" class="fixed inset-0 hidden bg-black/40 flex items-start justify-center p-6 backdrop-blur-sm">
      <div class="bg-white rounded-xl w-full max-w-2xl shadow-2xl overflow-hidden mt-20 border border-gray-200">
        <div class="flex items-center justify-between p-4 border-b bg-gray-50">
          <div class="flex items-center gap-2 w-full">
            <i class="ph ph-magnifying-glass text-lg text-gray-500"></i>
            <input id="iconify-picker-search" placeholder="Cari icon, mis. 'check', 'star', 'arrow'" class="w-full bg-transparent outline-none text-sm ml-2" />
            <button id="iconify-picker-clear" class="ml-2 text-xs font-bold text-gray-400 hover:text-red-500">CLEAR</button>
          </div>
          <button id="iconify-picker-close" class="ml-4 text-gray-400 hover:text-gray-600"><i class="ph ph-x text-xl"></i></button>
        </div>
        <div id="iconify-picker-results" class="p-4 grid grid-cols-6 gap-3 max-h-[300px] overflow-y-auto">
            <div class="col-span-full text-center text-gray-400 text-xs py-8">Ketik pencarian di atas...</div>
        </div>
      </div>
    </div>

    <header class="h-14 bg-white border-b border-gray-200 flex justify-between items-center px-4 z-50 fixed w-full top-0 left-0 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="/admin/pages" class="text-gray-400 hover:text-blue-600 p-1 rounded hover:bg-gray-100 transition"><i class="ph ph-arrow-left text-xl"></i></a>
            <div>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Slug Halaman</span>
                <input x-model="page.slug" class="bg-transparent font-mono font-bold text-sm text-gray-700 outline-none w-48 placeholder-gray-300 focus:text-blue-600 transition" placeholder="nama-halaman">
            </div>
        </div>
        
        <div class="flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
            <button @click="setDevice('desktop')" :class="device=='desktop'?'bg-white shadow text-blue-600':'text-gray-400'" class="p-1.5 rounded-md transition"><i class="ph ph-desktop"></i></button>
            <button @click="setDevice('mobile')" :class="device=='mobile'?'bg-white shadow text-blue-600':'text-gray-400'" class="p-1.5 rounded-md transition"><i class="ph ph-device-mobile"></i></button>
            <div class="w-px h-4 bg-gray-300 mx-2"></div>
            <button @click="cmd('core:preview')" class="p-1.5 hover:text-blue-600 text-gray-500"><i class="ph ph-eye"></i></button>
            <button @click="cmd('core:undo')" class="p-1.5 hover:text-gray-700 text-gray-400"><i class="ph ph-arrow-u-up-left"></i></button>
            <button @click="cmd('core:redo')" class="p-1.5 hover:text-gray-700 text-gray-400"><i class="ph ph-arrow-u-up-right"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button @click="showSettings=true" class="bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-gray-200 transition"><i class="ph ph-gear-six text-lg"></i> Config</button>
            <button @click="savePage" :disabled="loading" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-lg shadow-blue-500/30">
                <i x-show="loading" class="ph ph-spinner animate-spin"></i>
                <span x-text="loading ? 'SAVING...' : 'PUBLISH'"></span>
            </button>
        </div>
    </header>

    <div id="gjs"></div>
    
    <div class="sidebar-desktop">
        <div class="flex border-b bg-white">
            <button @click="tab='blocks'" :class="tab=='blocks'?'text-blue-600 border-b-2 border-blue-600 bg-blue-50':''" class="flex-1 p-3 text-gray-400 hover:text-gray-600 transition"><i class="ph ph-squares-four text-lg"></i></button>
            <button @click="tab='styles'" :class="tab=='styles'?'text-blue-600 border-b-2 border-blue-600 bg-blue-50':''" class="flex-1 p-3 text-gray-400 hover:text-gray-600 transition"><i class="ph ph-paint-brush text-lg"></i></button>
            <button @click="tab='traits'" :class="tab=='traits'?'text-blue-600 border-b-2 border-blue-600 bg-blue-50':''" class="flex-1 p-3 text-gray-400 hover:text-gray-600 transition"><i class="ph ph-sliders text-lg"></i></button>
            <button @click="tab='layers'" :class="tab=='layers'?'text-blue-600 border-b-2 border-blue-600 bg-blue-50':''" class="flex-1 p-3 text-gray-400 hover:text-gray-600 transition"><i class="ph ph-stack text-lg"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto relative bg-white">
            <div x-show="tab=='blocks'" id="blocks-container" class="pb-20"></div>
            <div x-show="tab=='styles'">
                <div id="selectors-container" class="p-3 border-b bg-gray-50"></div>
                <div id="styles-container" class="pb-20"></div>
            </div>
            <div x-show="tab=='traits'">
                <div class="p-3 bg-gray-50 text-gray-500 text-[10px] font-bold uppercase tracking-widest border-b">Settings</div>
                <div id="traits-container" class="p-2 pb-20"></div>
            </div>
            <div x-show="tab=='layers'" id="layers-container" class="pb-20"></div>
        </div>
    </div>

    <div x-show="showSettings" x-cloak class="fixed inset-0 z-[200] bg-slate-900/50 backdrop-blur-sm flex justify-end" @click.self="showSettings = false">
        <div class="settings-modal w-[450px] h-full bg-white shadow-2xl flex flex-col border-l border-gray-200" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="ph ph-faders text-blue-600 text-xl"></i> Konfigurasi Halaman</h2>
                <button @click="showSettings = false" class="text-gray-400 hover:text-red-500 transition"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll bg-white">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2"><i class="ph ph-package"></i> Tipe Produk</h3>
                    <div class="flex bg-gray-100 p-1 rounded-lg mb-4">
                        <button @click="page.product_type='physical'" :class="page.product_type=='physical'?'bg-white shadow-sm text-blue-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded-md transition">Fisik</button>
                        <button @click="page.product_type='digital'" :class="page.product_type=='digital'?'bg-white shadow-sm text-blue-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded-md transition">Digital</button>
                        <button @click="page.product_type='donation'" :class="page.product_type=='donation'?'bg-white shadow-sm text-blue-600':'text-gray-500'" class="flex-1 py-2 text-xs font-bold rounded-md transition">Donasi</button>
                    </div>
                    <div x-show="page.product_type==='physical'" class="space-y-3 bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <div>
                            <label class="text-[11px] font-bold text-gray-600">Berat (gram)</label>
                            <input x-model="page.config.shipping.weight" type="number" class="input-std mt-1" placeholder="1000">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="cod" x-model="page.config.shipping.cod" class="w-4 h-4 text-blue-600 rounded">
                            <label for="cod" class="text-xs font-medium text-gray-700">Aktifkan COD</label>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6" x-show="page.product_type !== 'donation'">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider gap-2 flex items-center"><i class="ph ph-tag"></i> Harga & Varian</h3>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(v, i) in page.config.variants">
                            <div class="flex gap-2 items-center">
                                <input x-model="v.name" class="input-std flex-1" placeholder="Nama Varian">
                                <input x-model="v.price" type="number" class="input-std w-24" placeholder="Rp">
                                <button @click="page.config.variants.splice(i,1)" class="text-red-500"><i class="ph ph-trash"></i></button>
                            </div>
                        </template>
                        <button @click="addVariant" class="w-full border-2 border-dashed border-gray-300 text-gray-500 font-bold text-xs py-2 rounded-lg hover:border-blue-400 hover:text-blue-500 transition">+ Tambah Varian</button>
                    </div>
                    <div x-show="page.config.variants.length === 0" class="mt-4">
                        <label class="text-[11px] font-bold text-gray-500">Harga Produk (Single)</label>
                        <input x-model="page.config.price" type="number" class="input-std mt-1" placeholder="0">
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-purple-600 uppercase tracking-wider flex gap-2 items-center"><i class="ph ph-lightning"></i> Order Bump</h3>
                        <input type="checkbox" x-model="page.config.order_bump.active" class="w-4 h-4 text-purple-600 rounded">
                    </div>
                    <div x-show="page.config.order_bump.active" class="space-y-3 bg-purple-50 p-4 rounded-lg border border-purple-100">
                        <input x-model="page.config.order_bump.title" class="input-std" placeholder="Judul Penawaran">
                        <input x-model="page.config.order_bump.price" type="number" class="input-std" placeholder="Harga Tambahan">
                        <textarea x-model="page.config.order_bump.desc" class="input-std" rows="2" placeholder="Deskripsi..."></textarea>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <h3 class="text-xs font-bold text-red-500 uppercase tracking-wider mb-3 flex gap-2 items-center"><i class="ph ph-ticket"></i> Kupon</h3>
                    <div class="space-y-2">
                        <template x-for="(c, i) in page.config.coupons">
                            <div class="flex gap-2">
                                <input x-model="c.code" class="input-std uppercase font-mono font-bold text-red-600 flex-1" placeholder="KODE">
                                <select x-model="c.type" class="input-std w-24"><option value="percent">%</option><option value="flat">Rp</option></select>
                                <input x-model="c.value" type="number" class="input-std w-20">
                                <button @click="page.config.coupons.splice(i,1)" class="text-red-500"><i class="ph ph-trash"></i></button>
                            </div>
                        </template>
                        <button @click="page.config.coupons.push({code:'', type:'percent', value:0})" class="w-full border border-red-200 text-red-500 text-xs font-bold py-2 rounded hover:bg-red-50">+ Kupon</button>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6">
                    <h3 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-3 flex gap-2 items-center"><i class="ph ph-credit-card"></i> Pembayaran</h3>
                    <label class="text-[10px] font-bold text-gray-500">Provider Default</label>
                    <select x-model="page.slug_payment" class="input-std mt-1 mb-4">
                        <option value="whatsapp">WhatsApp Manual</option>
                        <template x-for="p in paymentProviders" :key="p.slug"><option :value="p.slug" x-text="p.name"></option></template>
                    </select>
                    <div class="space-y-1 bg-gray-50 p-3 rounded border border-gray-200 h-32 overflow-y-auto">
                        <template x-for="p in paymentProviders" :key="p.slug">
                            <label class="flex items-center gap-2 p-1 hover:bg-white rounded cursor-pointer">
                                <input type="checkbox" :value="p.slug" x-model="page.config.active_payments" class="w-4 h-4 text-blue-600 rounded">
                                <span class="text-xs text-gray-700" x-text="p.name"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-6 space-y-3">
                    <h3 class="text-xs font-bold text-green-600 uppercase tracking-wider flex gap-2 items-center"><i class="ph ph-globe"></i> SEO</h3>
                    <div><label class="text-[10px] font-bold text-gray-500">Meta Title</label><input x-model="page.config.settings.seo_title" class="input-std"></div>
                    <div><label class="text-[10px] font-bold text-gray-500">Meta Desc</label><textarea x-model="page.config.settings.seo_description" class="input-std" rows="2"></textarea></div>
                    <div><label class="text-[10px] font-bold text-gray-500">Pixel FB</label><input x-model="page.config.settings.fb_pixel_id" class="input-std"></div>
                </div>
            </div>
            
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2">
                <button @click="showSettings=false" class="px-4 py-2 text-xs font-bold text-gray-500 hover:text-gray-700">TUTUP</button>
                <button @click="savePage(); showSettings=false" class="px-6 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700">SIMPAN</button>
            </div>
        </div>
    </div>

    <script>
    // --- ICONIFY LOGIC ---
    (function(){
        let iconifyPickerState = { model: null };
        const modal = document.getElementById('iconify-picker-modal');
        const input = document.getElementById('iconify-picker-search');
        const results = document.getElementById('iconify-picker-results');
        const closeBtn = document.getElementById('iconify-picker-close');
        const clearBtn = document.getElementById('iconify-picker-clear');

        window.openIconifyPicker = function(model){
            iconifyPickerState.model = model || null;
            if(modal) modal.classList.remove('hidden');
            if(input) input.focus();
        };

        function closeIconifyPicker(){
            if(modal) modal.classList.add('hidden');
            iconifyPickerState.model = null;
        }

        async function searchIconify(q){
            if(!q) return [];
            try {
                const res = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(q)}&limit=24`);
                const json = await res.json();
                return Array.isArray(json.icons) ? json.icons : [];
            } catch(e){ return []; }
        }

        function renderResults(list){
            if(!results) return;
            results.innerHTML = '';
            list.forEach(iconName=>{
                const btn = document.createElement('button');
                btn.className = 'flex flex-col items-center gap-1 p-2 rounded hover:bg-blue-50 border border-transparent hover:border-blue-200 transition';
                btn.innerHTML = `<iconify-icon icon="${iconName}" width="28" style="color:#333;"></iconify-icon><span class="text-[9px] text-gray-500 truncate w-full text-center">${iconName}</span>`;
                btn.addEventListener('click', ()=>{
                    if(iconifyPickerState.model) iconifyPickerState.model.addAttributes({ icon: iconName });
                    closeIconifyPicker();
                });
                results.appendChild(btn);
            });
        }

        let timeout;
        if(input) input.addEventListener('input', (e)=> {
            clearTimeout(timeout);
            timeout = setTimeout(async ()=>{ renderResults(await searchIconify(e.target.value)); }, 300);
        });
        if(closeBtn) closeBtn.addEventListener('click', closeIconifyPicker);
        if(clearBtn) clearBtn.addEventListener('click', ()=>{ input.value=''; input.focus(); });
    })();

    // --- EDITOR APP ---
    function editorApp() {
        return {
            loading: false, showSettings: false, device: 'desktop', tab: 'blocks', notifications: [], paymentProviders: [],
            page: { 
                slug: '', title: '', product_type: 'physical', slug_payment: 'whatsapp', 
                config: { price: 0, variants: [], shipping: { weight: 1000, cod: false }, order_bump: { active: false }, coupons: [], settings: {}, active_payments: [] } 
            },

            async init() {
                const params = new URLSearchParams(window.location.search);
                this.page.slug = params.get('slug');
                await this.fetchPaymentProviders();
                this.initGrapes();
            },

            async fetchPaymentProviders() {
                try {
                    const res = await fetch('/api/admin/templates?type=payment', { credentials: 'same-origin' });
                    if(res.ok) {
                        const json = await res.json();
                        this.paymentProviders = Array.isArray(json) ? json : (json.results || []);
                    } else if (res.status === 401) { window.location.href = '/login'; }
                } catch(e){}
            },

            notify(title, msg, type = 'success') {
                const id = Date.now();
                this.notifications.push({ id, title, msg, type, show: true });
                setTimeout(() => { 
                    const i = this.notifications.findIndex(n => n.id === id);
                    if(i > -1) this.notifications[i].show = false; 
                }, 3000);
            },

            setDevice(d) { this.device = d; window.editor.setDevice(d); },
            cmd(c) { window.editor.runCommand(c); },
            addVariant() { this.page.config.variants.push({ name: '', price: 0 }); },

            async savePage() {
                this.loading = true;
                let html = window.editor.getHtml();
                // Inject Page ID untuk Form Contact agar API tahu ini dari page mana
                html = html.replace('name="page_id" value="0"', `name="page_id" value="${this.page.id||0}"`);
                
                try {
                    const res = await fetch('/api/admin/pages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            slug: this.page.slug, title: this.page.title, product_type: this.page.product_type,
                            provider: this.page.slug_payment, html: html, css: window.editor.getCss(), product_config: this.page.config
                        })
                    });
                    if(res.ok) this.notify('Sukses', 'Halaman tersimpan!');
                    else this.notify('Gagal', 'Terjadi kesalahan', 'error');
                } catch(e) { this.notify('Error', 'Network Error', 'error'); }
                this.loading = false;
            },

            initGrapes() {
                window.editor = grapesjs.init({
                    container: '#gjs', height: '100%', fromElement: false, storageManager: false,
                    canvas: {
                        styles: ['https://cdn.tailwindcss.com', '@media (max-width: 480px) { body { padding: 0 16px; } }']
                    },
                    plugins: ['gjs-blocks-basic', 'grapesjs-plugin-forms', 'grapesjs-navbar', 'grapesjs-component-countdown', 'grapesjs-tabs', 'grapesjs-custom-code', 'grapesjs-tooltip', 'grapesjs-blocks-flexbox', 'grapesjs-plugin-export', 'grapesjs-typed', 'grapesjs-style-bg'],
                    deviceManager: { devices: [{ id: 'desktop', width: '' }, { id: 'tablet', width: '768px' }, { id: 'mobile', width: '375px' }] },
                    blockManager: { appendTo: '#blocks-container' },
                    layerManager: { appendTo: '#layers-container' },
                    selectorManager: { appendTo: '#selectors-container' },
                    traitManager: { appendTo: '#traits-container' },
                    styleManager: { appendTo: '#styles-container', sectors: [{name:'Typography', open:true, buildProps:['font-family','font-size','font-weight','color','text-align']},{name:'Decorations', open:false, buildProps:['background-color','border','border-radius','box-shadow']},{name:'Dimensions', open:false, buildProps:['width','height','padding','margin']}] }
                });

                // --- 1. COMPONENT LOGIC ---
                // Iconify
                window.editor.DomComponents.addType('iconify-icon', {
                    model: {
                        defaults: {
                            tagName: 'iconify-icon', droppable: false,
                            attributes: { icon: 'mdi:home', width: '48', style: 'color:#2563eb' },
