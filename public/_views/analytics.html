<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Analytics - BlinkSite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200 font-sans" x-data="analyticsApp()" x-init="init()" :class="darkMode ? 'dark' : ''">

    <div class="flex h-screen overflow-hidden" x-cloak>
        <aside class="flex flex-col h-screen border-r dark:border-gray-700 bg-white dark:bg-gray-800 transition-all duration-300" :class="sidebarOpen ? 'w-64' : 'w-20'">
            <div class="h-16 flex items-center justify-center border-b dark:border-gray-700 shrink-0">
                <span x-show="sidebarOpen" class="text-xl font-black text-blue-600 tracking-tighter">BlinkSite</span>
                <span x-show="!sidebarOpen" class="text-xl font-bold text-blue-600">B</span>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                <a href="/admin/dashboard" class="flex items-center gap-3 px-3 py-3 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <i class="ph ph-squares-four text-xl shrink-0"></i>
                    <span x-show="sidebarOpen" class="font-medium">Dashboard</span>
                </a>
                <a href="/admin/analytics" class="flex items-center gap-3 px-3 py-3 rounded-lg bg-blue-600 text-white shadow-md">
                    <i class="ph ph-trend-up text-xl shrink-0"></i>
                    <span x-show="sidebarOpen" class="font-medium">Traffic</span>
                </a>
                </nav>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white dark:bg-gray-800 border-b dark:border-gray-700 flex justify-between items-center px-4 shadow-sm z-20">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="ph ph-list text-2xl"></i></button>
                    <h1 class="font-bold text-lg text-gray-800 dark:text-white">Traffic Stats</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right mr-4 hidden md:block">
                        <p class="text-xs text-gray-500">Total Views</p>
                        <p class="font-bold dark:text-white" x-text="totalViews.toLocaleString()"></p>
                    </div>
                    <button @click="toggleTheme()" class="p-2 rounded-full border dark:border-gray-600 text-gray-600 dark:text-gray-300">
                        <i x-show="!darkMode" class="ph ph-moon text-xl"></i>
                        <i x-show="darkMode" class="ph ph-sun text-xl text-yellow-400"></i>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 md:p-8">
                <div class="max-w-7xl mx-auto space-y-6">
                    
                    <div class="grid grid-cols-1 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border dark:border-gray-700">
                            <h3 class="font-bold text-sm uppercase text-gray-500 mb-6">Distribusi Views per Halaman</h3>
                            <div class="relative h-80 w-full">
                                <canvas id="topPagesChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 overflow-hidden">
                        <div class="p-5 border-b dark:border-gray-700 flex justify-between items-center">
                            <h3 class="font-bold text-sm uppercase text-gray-500">Detail Performa Halaman</h3>
                            <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-bold">Update per 15 Menit</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-gray-50 dark:bg-gray-900 border-b dark:border-gray-700">
                                    <tr>
                                        <th class="px-6 py-4 text-xs uppercase text-gray-500 font-bold">Halaman</th>
                                        <th class="px-6 py-4 text-xs uppercase text-gray-500 font-bold">Path/Slug</th>
                                        <th class="px-6 py-4 text-xs uppercase text-gray-500 font-bold text-right">Total Views</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                    <template x-for="page in topPages" :key="page.slug">
                                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                                            <td class="px-6 py-4 font-semibold text-gray-800 dark:text-gray-200" x-text="page.title"></td>
                                            <td class="px-6 py-4 text-blue-600 font-mono text-xs">/<span x-text="page.slug"></span></td>
                                            <td class="px-6 py-4 text-right font-bold text-gray-700 dark:text-gray-300" x-text="page.views.toLocaleString()"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <script>
    function analyticsApp() {
        return {
            sidebarOpen: window.innerWidth > 768,
            darkMode: localStorage.getItem('theme') === 'dark',
            topPages: [],
            totalViews: 0,

            async init() {
                if (this.darkMode) document.documentElement.classList.add('dark');
                await this.fetchData();
            },

            async fetchData() {
                try {
                    // Kita tidak perlu header Authorization jika Cookie auth_token sudah ada
                    const res = await fetch('/api/admin/analytics/data');
                    
                    if (res.ok) {
                        const data = await res.json();
                        this.topPages = data.top_pages || [];
                        this.totalViews = data.stats.total_views || 0;
                        this.renderCharts(data.top_pages);
                    } else if (res.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error("Gagal load data:", e);
                }
            },

            renderCharts(pages) {
                if (Chart.getChart("topPagesChart")) Chart.getChart("topPagesChart").destroy();

                new Chart(document.getElementById('topPagesChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: pages.map(p => p.title),
                        datasets: [{
                            label: 'Views',
                            data: pages.map(p => p.views),
                            backgroundColor: '#3b82f6',
                            borderRadius: 8,
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { 
                                beginAtZero: true,
                                grid: { color: this.darkMode ? '#374151' : '#f3f4f6' }
                            },
                            x: { 
                                grid: { display: false },
                                ticks: { color: this.darkMode ? '#9ca3af' : '#6b7280' }
                            }
                        }
                    }
                });
            },

            toggleTheme() {
                this.darkMode = !this.darkMode;
                localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark');
                if (this.topPages.length) this.renderCharts(this.topPages);
            },

            async logout() {
                await fetch('/api/logout');
                window.location.href = '/login';
            }
        }
    }
    </script>
</body>
</html>
