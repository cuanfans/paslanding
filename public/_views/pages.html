<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pages - BlinkSite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>if (!localStorage.getItem('admin_pass')) window.location.href = '/login';</script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" x-data="pagesApp()">

    <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 z-30 hidden md:flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <h1 class="font-black text-2xl text-blue-600 tracking-tighter">Blink<span class="text-gray-800">Site</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                <i class="ph ph-squares-four text-lg"></i> Dashboard
            </a>
            <a href="/admin/pages" class="flex items-center gap-3 px-4 py-3 text-sm font-bold bg-blue-50 text-blue-600 rounded-lg">
                <i class="ph ph-files text-lg"></i> Landing Pages
            </a>
            <a href="/admin/reports" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                <i class="ph ph-chart-line-up text-lg"></i> Reports
            </a>
            <a href="/admin/settings" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-lg transition">
                <i class="ph ph-gear text-lg"></i> Settings
            </a>
        </nav>
    </aside>

    <main class="md:ml-64 min-h-screen p-4 md:p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Landing Pages</h2>
                <p class="text-gray-500 text-sm mt-1">Kelola semua halaman penjualan Anda di sini.</p>
            </div>
            <button @click="createPage" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg shadow-blue-500/30 transition">
                <i class="ph ph-plus-circle text-lg"></i> Buat Baru
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-200 mb-6 flex gap-4">
            <div class="flex-1 relative">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input x-model="search" type="text" placeholder="Cari halaman..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
            <select class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold text-gray-600 outline-none">
                <option>Terbaru</option>
                <option>Terlama</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="page in filteredPages" :key="page.id">
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition group overflow-hidden flex flex-col h-full">
                    <div class="h-32 bg-gray-100 flex items-center justify-center border-b border-gray-100 relative">
                        <i class="ph ph-browser text-4xl text-gray-300"></i>
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-3 backdrop-blur-sm">
                            <a :href="'/'+page.slug" target="_blank" class="p-2 bg-white rounded-full text-gray-800 hover:text-blue-600 transition" title="View"><i class="ph ph-eye text-lg"></i></a>
                            <a :href="'/admin/editor?slug='+page.slug" class="p-2 bg-blue-600 rounded-full text-white hover:bg-blue-700 transition" title="Edit"><i class="ph ph-pencil-simple text-lg"></i></a>
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-800 truncate" x-text="page.title || 'Untitled Page'"></h3>
                            <span class="text-[10px] px-2 py-1 rounded-full bg-blue-50 text-blue-600 font-bold uppercase tracking-wider" x-text="page.product_type"></span>
                        </div>
                        <p class="text-xs text-gray-400 font-mono mb-4 flex-1">/<span x-text="page.slug"></span></p>
                        <div class="flex justify-between items-center pt-4 border-t border-gray-100 mt-auto">
                            <span class="text-[10px] text-gray-400" x-text="new Date(page.created_at).toLocaleDateString()"></span>
                            <div class="flex gap-2">
                                <button class="text-gray-400 hover:text-blue-600 transition"><i class="ph ph-copy text-lg"></i></button>
                                <button class="text-gray-400 hover:text-red-500 transition"><i class="ph ph-trash text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="filteredPages.length === 0" class="text-center py-20">
            <div class="inline-flex h-16 w-16 bg-gray-100 rounded-full items-center justify-center text-gray-400 mb-4">
                <i class="ph ph-files text-3xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-600">Tidak ada halaman ditemukan.</h3>
            <p class="text-gray-400 text-sm mt-1">Buat halaman baru untuk memulai penjualan.</p>
        </div>
    </main>

    <script>
        function pagesApp() {
            return {
                pages: [],
                search: '',
                token: localStorage.getItem('admin_pass'),
                
                get filteredPages() {
                    if (!this.search) return this.pages;
                    return this.pages.filter(p => p.title?.toLowerCase().includes(this.search.toLowerCase()) || p.slug?.toLowerCase().includes(this.search.toLowerCase()));
                },

                async init() {
                    try {
                        const res = await fetch('/api/admin/pages', { headers: { 'Authorization': this.token } });
                        this.pages = await res.json();
                    } catch(e) { console.error(e); }
                },

                createPage() {
                    const slug = prompt("Masukkan URL Slug untuk halaman baru (misal: promo-lebaran):");
                    if(slug) {
                        window.location.href = `/admin/editor?slug=${slug.toLowerCase().replace(/[^a-z0-9-]/g, '-')}`;
                    }
                }
            }
        }
    </script>
</body>
</html>
